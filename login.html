<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Secure Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0fdfa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1); width: 100%; max-width: 360px; text-align: center; }
    h2 { color: #0f766e; margin-bottom: 8px; font-weight: 800; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s; text-align: center; letter-spacing: 1px; }
    input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
    .btn { background: #0f766e; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:hover { background: #115e59; transform: translateY(-1px); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .forgot-link { display: inline-block; margin-top: 16px; font-size: 13px; color: #0f766e; text-decoration: none; font-weight: 600; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }
    .message { margin-top: 16px; font-size: 13px; font-weight: 600; display: none; padding: 10px; border-radius: 8px; }
    .msg-error { background: #fee2e2; color: #991b1b; display: block; }
    .msg-success { background: #d1fae5; color: #065f46; display: block; }
  </style>
</head>
<body>

  <div class="login-card" id="loginView">
    <h2>Secure Login</h2>
    <p>Multi-User Portal Active.</p>
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="useridInput" placeholder="Enter User ID">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn">Login securely</button>
    <a class="forgot-link" id="showForgotBtn">Forgot Password?</a>
    <div id="loginMsg" class="message"></div>
  </div>

  <div class="login-card" id="forgotView" style="display: none;">
    <h2>Reset Password</h2>
    <p>Receive password on recovery email.</p>
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="forgotUseridInput" placeholder="Enter User ID">
    </div>
    <button class="btn" id="sendEmailBtn">Send Password</button>
    <a class="forgot-link" id="showLoginBtn">Back to Login</a>
    <div id="forgotMsg" class="message"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyM7IldJ4TWlvcXWW4joDo1VHe-LnpnXhvJDS2wVEu9eOs5YXdysosW1DTxkCPuxd3-/exec";
    
    const loginView = document.getElementById('loginView');
    const forgotView = document.getElementById('forgotView');
    
    document.getElementById('showForgotBtn').addEventListener('click', () => { loginView.style.display='none'; forgotView.style.display='block'; });
    document.getElementById('showLoginBtn').addEventListener('click', () => { forgotView.style.display='none'; loginView.style.display='block'; });

    function showMsg(id, text, className) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'message ' + className;
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const userid = document.getElementById('useridInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      
      if(!userid || !password) return showMsg('loginMsg', 'Enter User ID and Password!', 'msg-error');

      btn.innerText = "Authenticating...";
      btn.disabled = true;
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', userid: userid, password: password })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          showMsg('loginMsg', 'Login Successful!', 'msg-success');
          sessionStorage.setItem('pharmaAdminToken', data.token);
          sessionStorage.setItem('pharmaCurrentUsername', data.username);
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          showMsg('loginMsg', data.message || 'Invalid details!', 'msg-error');
        }
      })
      .catch(err => showMsg('loginMsg', 'Internet error. Try again.', 'msg-error'))
      .finally(() => { btn.innerText = "Login securely"; btn.disabled = false; });
    });

    document.getElementById('sendEmailBtn').addEventListener('click', () => {
      const userid = document.getElementById('forgotUseridInput').value.trim();
      const btn = document.getElementById('sendEmailBtn');
      if(!userid) return showMsg('forgotMsg', 'Enter User ID!', 'msg-error');

      btn.innerText = "Sending...";
      btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'forgotPassword', userid: userid })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          showMsg('forgotMsg', 'Password sent to email!', 'msg-success');
        } else {
          showMsg('forgotMsg', data.message, 'msg-error');
        }
      })
      .catch(err => showMsg('forgotMsg', 'Internet error.', 'msg-error'))
      .finally(() => { btn.innerText = "Send Password"; btn.disabled = false; });
    });
  </script>
</body>
</html>
