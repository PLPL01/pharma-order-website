<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Secure Pharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // જો પહેલેથી લોગિન હોય તો ડાયરેક્ટ admin.html પર મોકલી દો
    if (sessionStorage.getItem('pharmaAdminToken')) {
        window.location.href = 'admin.html';
    }
    const savedTheme = localStorage.getItem('pharmaTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05); --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
      --input-bg: #f8fafc;
    }
    [data-theme="dark"] {
      --bg: #000000; --surface: #0f0f0f; --primary: #14b8a6; --primary-hover: #0d9488;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border: #27272a;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.5); --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.8);
      --input-bg: #111111;
    }

    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); transition: 0.3s; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .login-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow-lg); transition: 0.3s; box-sizing: border-box; text-align: center; position: relative; }
    
    .theme-btn { position: absolute; top: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; color: var(--text-main); outline: none; }
    
    .logo-icon { font-size: 48px; margin-bottom: 10px; }
    h1 { margin: 0 0 8px; color: var(--text-main); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0 0 30px 0; font-size: 14px; font-weight: 500; }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-main); }
    
    input[type="text"], input[type="password"] { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--input-bg); color: var(--text-main); outline: none; box-sizing: border-box; transition: all 0.3s ease; font-family: 'Inter', sans-serif; font-weight: 500; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1); background: var(--surface); }
    
    .btn-submit { width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; border: none; cursor: pointer; background: var(--primary); color: #fff; transition: 0.3s; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3); margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(15, 118, 110, 0.4); }
    .btn-submit:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7; }

    .error-box { display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 20px; text-align: left; animation: shake 0.4s ease-in-out; }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
    }

    .footer-text { margin-top: 24px; font-size: 12px; color: var(--text-muted); font-weight: 500; }
  </style>
</head>
<body>

  <div class="login-card">
    <button class="theme-btn" id="themeToggleBtn">☀️</button>
    <div class="logo-icon">🔐</div>
    <h1>Secure Login</h1>
    <p>Admin & Staff Portal</p>

    <div class="error-box" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="userid">👤 User ID</label>
        <input type="text" id="userid" placeholder="Enter your ID" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label for="password">🔑 Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">Log In</button>
    </form>
    
    <div class="footer-text">Protected by Premium ERP Security</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRju9C_1S14BJcPlRyOCnb03vjvqGx1ZdSPu3X8_PicTLSCpWHv4T2tn3OtP7hJ07E/exec";
    
    // Theme logic
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    themeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pharmaTheme', next);
      themeBtn.innerText = next === 'dark' ? '☀️' : '🌙';
    });

    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsgBox = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        errorMsgBox.style.display = 'none';
        
        const useridVal = document.getElementById('userid').value.trim();
        const passwordVal = document.getElementById('password').value.trim();
        
        loginBtn.disabled = true;
        loginBtn.innerText = 'Verifying...';

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ 
                    action: 'login', 
                    userid: useridVal, 
                    password: passwordVal 
                })
            });

            const data = await response.json();

            if (data.status === 'success') {
                sessionStorage.setItem('pharmaAdminToken', data.token);
                
                // MAIN BUG FIX: ડેટાબેઝ પર આધાર રાખ્યા વગર યુઝરે જે ટાઈપ કર્યું તે જ સીધું સેવ કરો!
                sessionStorage.setItem('pharmaCurrentUsername', useridVal); 
                
                sessionStorage.setItem('pharmaUserRole', data.role);
                window.location.href = 'admin.html';
            } else {
                errorMsgBox.innerHTML = `<b>❌ Access Denied:</b> Invalid User ID or Password.`;
                errorMsgBox.style.display = 'block'; 
                document.getElementById('password').value = ''; 
                loginBtn.disabled = false;
                loginBtn.innerText = 'Log In';
            }

        } catch (error) {
            errorMsgBox.innerHTML = `<b>⚠️ Network Error:</b> Please check your internet connection and try again.`;
            errorMsgBox.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.innerText = 'Log In';
        }
    });
  </script>
</body>
</html>
