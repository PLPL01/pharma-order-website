<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Secure Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f0fdfa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .login-card { background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1); width: 100%; max-width: 380px; text-align: center; box-sizing: border-box; }
    h2 { color: #0f766e; margin-bottom: 8px; font-weight: 800; font-size: 26px; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.2s; text-align: center; letter-spacing: 1px; }
    input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
    .btn { background: #0f766e; color: #fff; width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:hover { background: #115e59; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,118,110,0.2); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    .message { margin-top: 16px; font-size: 13px; font-weight: 600; display: none; padding: 12px; border-radius: 10px; }
    .msg-error { background: #fee2e2; color: #991b1b; display: block; }
    .msg-success { background: #d1fae5; color: #065f46; display: block; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Secure Login</h2>
    <p>Multi-User Portal Active.</p>
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="useridInput" placeholder="Enter User ID">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn">Login securely</button>
    <div id="loginMsg" class="message"></div>
  </div>

  <script>
    // 👇 તમારી લિંક અહીં સેટ જ છે
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbznm1w4OTRlnrO1VwMv1vUHSlo2vrMgieVLowjte4lCR2_lwvSbHiigFBJy3OnjSes-/exec";

    document.getElementById('loginBtn').addEventListener('click', () => {
      const userid = document.getElementById('useridInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      const msgDiv = document.getElementById('loginMsg');
      
      if(!userid || !password) {
        msgDiv.innerText = "Please enter User ID and Password!";
        msgDiv.className = 'message msg-error';
        return;
      }

      btn.innerText = "Authenticating..."; 
      btn.disabled = true;
      msgDiv.style.display = 'none';
      
      fetch(WEB_APP_URL, { 
        method: 'POST', 
        body: JSON.stringify({ action: 'login', userid: userid, password: password }) 
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          msgDiv.innerText = "Login Successful!";
          msgDiv.className = 'message msg-success';
          sessionStorage.setItem('pharmaAdminToken', data.token);
          sessionStorage.setItem('pharmaCurrentUsername', data.username);
          sessionStorage.setItem('pharmaUserRole', data.role);
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          msgDiv.innerText = data.message || "Invalid details!";
          msgDiv.className = 'message msg-error';
        }
      })
      .catch(err => {
        msgDiv.innerText = "Internet error. Try again.";
        msgDiv.className = 'message msg-error';
      })
      .finally(() => { 
        btn.innerText = "Login securely"; 
        btn.disabled = false; 
      });
    });
  </script>
</body>
</html>
