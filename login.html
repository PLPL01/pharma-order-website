<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title>
<style>
  body { font-family: sans-serif; background: #f0fdfa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: #fff; padding: 30px; border-radius: 16px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  .btn { width: 100%; padding: 12px; background: #0f766e; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <h2>Login</h2>
    <input type="text" id="uid" placeholder="User ID">
    <input type="password" id="pass" placeholder="Password">
    <button class="btn" id="loginBtn">Login</button>
  </div>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbznm1w4OTRlnrO1VwMv1vUHSlo2vrMgieVLowjte4lCR2_lwvSbHiigFBJy3OnjSes-/exec";
    document.getElementById('loginBtn').addEventListener('click', () => {
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'login', userid: document.getElementById('uid').value, password: document.getElementById('pass').value }) })
      .then(res => res.json()).then(data => {
        if(data.status === 'success') {
          sessionStorage.setItem('pharmaAdminToken', data.token);
          sessionStorage.setItem('pharmaCurrentUsername', data.username);
          sessionStorage.setItem('pharmaUserRole', data.role);
          window.location.href = 'admin.html';
        } else { alert(data.message); }
      });
    });
  </script>
</body>
</html>
