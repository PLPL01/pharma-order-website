<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - Secure Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    const savedTheme = localStorage.getItem('pharmaTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
      --shadow: 0 10px 25px rgba(15, 118, 110, 0.1); --input-bg: #ffffff;
    }
    
    [data-theme="dark"] {
      --bg: #000000; --surface: #0f0f0f; --primary: #14b8a6; --primary-hover: #0d9488;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border: #27272a;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.8); --input-bg: #111111;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; transition: background 0.3s ease, color 0.3s ease; }
    
    .theme-btn { position: absolute; top: 20px; right: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; box-shadow: var(--shadow); transition: 0.2s; color: var(--text-main); }
    .theme-btn:hover { border-color: var(--primary); }

    .login-card { background: var(--surface); padding: 40px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; box-sizing: border-box; transition: all 0.3s ease; }
    h2 { color: var(--primary); margin-bottom: 8px; font-weight: 800; font-size: 26px; }
    p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.2s; text-align: center; letter-spacing: 1px; background: var(--input-bg); color: var(--text-main); }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2); }
    .btn { background: var(--primary); color: #fff; width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(20, 184, 166, 0.2); }
    .btn:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }
    .message { margin-top: 16px; font-size: 13px; font-weight: 600; display: none; padding: 12px; border-radius: 10px; }
    
    .msg-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; display: block; }
    .msg-success { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; display: block; }
    
    @media (max-width: 480px) {
      .login-card { padding: 30px 20px; border-radius: 16px; }
      h2 { font-size: 22px; }
      input, .btn { padding: 12px; font-size: 14px; }
      .theme-btn { top: 15px; right: 15px; width: 38px; height: 38px; font-size: 16px; }
    }
  </style>
</head>
<body>

  <button class="theme-btn" id="themeToggleBtn" title="Toggle Theme"></button>

  <div class="login-card">
    <h2>Secure Login</h2>
    <p>Multi-User Portal Active.</p>
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="useridInput" placeholder="Enter User ID">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button class="btn" id="loginBtn">Login securely</button>
    <div id="loginMsg" class="message"></div>
  </div>

  <script>
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pharmaTheme', next);
      themeBtn.innerText = next === 'dark' ? '☀️' : '🌙';
    });

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgSqRCK9BDyxXPdac6clcXzSS1kY0tlA0AIK_C1io030Mxi0BpUoMjMO31Bhq_BcKa/exec";

    document.getElementById('loginBtn').addEventListener('click', () => {
      const userid = document.getElementById('useridInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      const msgDiv = document.getElementById('loginMsg');
      
      if(!userid || !password) {
        msgDiv.innerText = "Please enter User ID and Password!";
        msgDiv.className = 'message msg-error';
        return;
      }

      btn.innerText = "Authenticating..."; 
      btn.disabled = true;
      msgDiv.style.display = 'none';
      
      fetch(WEB_APP_URL, { 
        method: 'POST', 
        body: JSON.stringify({ action: 'login', userid: userid, password: password }) 
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          msgDiv.innerText = "Login Successful!";
          msgDiv.className = 'message msg-success';
          sessionStorage.setItem('pharmaAdminToken', data.token);
          sessionStorage.setItem('pharmaCurrentUsername', data.username);
          sessionStorage.setItem('pharmaUserRole', data.role);
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          msgDiv.innerText = data.message || "Invalid details!";
          msgDiv.className = 'message msg-error';
        }
      })
      .catch(err => {
        msgDiv.innerText = "Internet error. Try again.";
        msgDiv.className = 'message msg-error';
      })
      .finally(() => { 
        btn.innerText = "Login securely"; 
        btn.disabled = false; 
      });
    });
  </script>
</body>
</html>
