<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    h2 { color: #0f766e; margin-bottom: 8px; font-weight: 800; }
    p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #e2e8f0;
      border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.2s;
    }
    input:focus { border-color: #0f766e; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1); }
    .btn {
      background: #0f766e; color: #fff; width: 100%; padding: 12px;
      border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 10px;
    }
    .btn:hover { background: #115e59; transform: translateY(-1px); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .forgot-link {
      display: inline-block; margin-top: 16px; font-size: 13px; color: #0f766e; text-decoration: none; font-weight: 600; cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }
    .message { margin-top: 16px; font-size: 13px; font-weight: 600; display: none; padding: 10px; border-radius: 8px; }
    .msg-error { background: #fee2e2; color: #991b1b; display: block; }
    .msg-success { background: #d1fae5; color: #065f46; display: block; }
  </style>
</head>
<body>

  <div class="login-card" id="loginView">
    <h2>Admin Dashboard</h2>
    <p>Please login to access live orders.</p>
    
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="useridInput" placeholder="Enter User ID">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    
    <button class="btn" id="loginBtn">Login Now</button>
    <a class="forgot-link" id="showForgotBtn">Forgot Password?</a>
    
    <div id="loginMsg" class="message"></div>
  </div>

  <div class="login-card" id="forgotView" style="display: none;">
    <h2>Reset Password</h2>
    <p>Enter your User ID to receive the password on your recovery email.</p>
    
    <div class="input-group">
      <label>User ID</label>
      <input type="text" id="forgotUseridInput" placeholder="Enter User ID">
    </div>
    
    <button class="btn" id="sendEmailBtn">Send Password</button>
    <a class="forgot-link" id="showLoginBtn">Back to Login</a>
    
    <div id="forgotMsg" class="message"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxWmU2xKySlRSHcCp-bs7xYFhoLdHOs08-nVxb9yuIz37UbVPOq9hSYHfS3uVEcTbo8/exec";
    
    // UI Elements
    const loginView = document.getElementById('loginView');
    const forgotView = document.getElementById('forgotView');
    const loginMsg = document.getElementById('loginMsg');
    const forgotMsg = document.getElementById('forgotMsg');

    // Switch Views
    document.getElementById('showForgotBtn').addEventListener('click', () => {
      loginView.style.display = 'none';
      forgotView.style.display = 'block';
      loginMsg.style.display = 'none';
    });
    
    document.getElementById('showLoginBtn').addEventListener('click', () => {
      forgotView.style.display = 'none';
      loginView.style.display = 'block';
      forgotMsg.style.display = 'none';
    });

    // LOGIN ACTION
    document.getElementById('loginBtn').addEventListener('click', () => {
      const userid = document.getElementById('useridInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('loginBtn');
      
      if(!userid || !password) {
        showMsg(loginMsg, 'User ID ane Password banne nakho!', 'msg-error');
        return;
      }

      btn.innerText = "Checking...";
      btn.disabled = true;
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', userid: userid, password: password })
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success') {
          showMsg(loginMsg, 'Login Success!', 'msg-success');
          sessionStorage.setItem('isPharmaAdminLoggedIn', 'true');
          setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
        } else {
          showMsg(loginMsg, data.message || 'Khoti details!', 'msg-error');
          btn.innerText = "Login Now";
          btn.disabled = false;
        }
      })
      .catch(err => {
        showMsg(loginMsg, 'Internet error. Try again.', 'msg-error');
        btn.innerText = "Login Now";
        btn.disabled = false;
      });
    });

    // FORGOT PASSWORD ACTION
    document.getElementById('sendEmailBtn').addEventListener('click', () => {
      const userid = document.getElementById('forgotUseridInput').value.trim();
      const btn = document.getElementById('sendEmailBtn');
      
      if(!userid) {
        showMsg(forgotMsg, 'Pehla User ID nakho!', 'msg-error');
        return;
      }

      btn.innerText = "Sending Email...";
      btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'forgotPassword', userid: userid })
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success') {
          showMsg(forgotMsg, 'Password tamara email par mokli didho chhe!', 'msg-success');
          btn.innerText = "Sent Successfully";
        } else {
          showMsg(forgotMsg, data.message || 'System ma User ID nathi.', 'msg-error');
          btn.innerText = "Send Password";
          btn.disabled = false;
        }
      })
      .catch(err => {
        showMsg(forgotMsg, 'Internet error.', 'msg-error');
        btn.innerText = "Send Password";
        btn.disabled = false;
      });
    });

    function showMsg(element, text, className) {
      element.textContent = text;
      element.className = 'message ' + className;
    }
  </script>
</body>
</html>
