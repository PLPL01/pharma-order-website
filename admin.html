<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pharma Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // 🔒 SECURITY CHECK: Jo login nathi karyu, to redirect to login page
    if (sessionStorage.getItem('isPharmaAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
    }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text-main); }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); }
    .header-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; color: var(--text-main); font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0; font-size: 15px; }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .controls-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
    .filters-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .actions-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; }
    .input-box { flex: 1; min-width: 200px; }
    .filter-box { min-width: 150px; }
    input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-main); background: #fff; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    .btn { padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: #fff; color: var(--text-main); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover { background: #fca5a5; }
    
    .order-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .order-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; border-top: 6px solid var(--primary); transition: transform 0.2s; }
    .order-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .order-id { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 4px; }
    .order-time { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .customer-info { font-weight: 700; color: var(--text-main); font-size: 16px; }
    .customer-mobile { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
    
    /* MODIFIED: Items Box with Scrolling */
    .items-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
    .items-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.05em; }
    
    .items-list-scroll { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
    /* Custom Scrollbar */
    .items-list-scroll::-webkit-scrollbar { width: 5px; }
    .items-list-scroll::-webkit-scrollbar-track { background: transparent; }
    .items-list-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .items-list-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .item-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-name { font-weight: 600; color: #334155; flex: 1; padding-right: 10px; }
    .item-qty { font-weight: 800; color: var(--primary); background: #e2e8f0; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    
    .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-normal { background: #f1f5f9; color: #475569; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    .status-dropdown { border: 2px solid transparent; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; width: 150px; transition: all 0.2s; }
    .status-saving { opacity: 0.5; pointer-events: none; }
    .loading-status { text-align: center; padding: 50px; color: var(--text-muted); font-weight: 600; font-size: 16px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Card-Based Order Grouping System (Secure Mode)</p>
      </div>
      <div>
        <button class="btn btn-danger" id="logoutBtn">🚪 Logout</button>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="totalOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" style="color:#d97706;" id="pendingOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Skyway (Clear)</span>
        <span class="stat-value" style="color:#059669;" id="skywayOrdersCount">0</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="filters-row">
        <div class="input-box" style="flex: 2;">
          <input type="text" id="globalSearchInput" placeholder="🔍 Search Name, Mobile, Product or ID...">
        </div>
        <div class="filter-box"><input type="date" id="dateFilterInput" title="Select Date"></div>
        <div class="filter-box">
          <select id="priorityFilter">
            <option value="">All Priorities</option>
            <option value="Normal">Normal</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="filter-box">
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Skyway">Skyway</option>
            <option value="Not available">Not available</option>
          </select>
        </div>
      </div>
      
      <div class="actions-row">
        <button class="btn btn-ghost" id="resetFiltersBtn">🧹 Reset Filters</button>
        <button class="btn btn-ghost" id="fetchDataBtn">🔄 Refresh Data</button>
        <button class="btn btn-primary" id="exportCsvBtn">📥 Export to Excel</button>
      </div>
    </div>

    <div id="cardsContainer" class="order-cards-container">
       <div class="loading-status">🔄 Fetching fresh data from Server...</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxWmQZF6nm_uc_BlwGKizJ0pOg3QTMG5dyuQU7TFh20WTLHkViXAc4Uu4yy-imW1JaD/exec";

    // Logout Function
    document.getElementById('logoutBtn').addEventListener('click', () => {
       sessionStorage.removeItem('isPharmaAdminLoggedIn');
       window.location.href = 'login.html';
    });

    const cardsContainer = document.getElementById('cardsContainer');
    let allOrders = [];

    function fetchLiveOrders() {
      cardsContainer.innerHTML = '<div class="loading-status">🔄 Downloading live data from Google Sheet...</div>';
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if(data.status === "error" || !Array.isArray(data) || data.length === 0) {
            cardsContainer.innerHTML = '<div class="loading-status" style="color:#b42318;">No data found. Please wait for new orders.</div>';
            return;
          }
          allOrders = data;
          allOrders.reverse();
          applyFilters();
        })
        .catch(err => {
          cardsContainer.innerHTML = '<div class="loading-status" style="color:#b42318;">Connection error. Check Internet.</div>';
        });
    }

    function applyFilters() {
      const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
      const dateQuery = document.getElementById('dateFilterInput').value;
      const priorityQuery = document.getElementById('priorityFilter').value.toLowerCase().trim();
      const statusQuery = document.getElementById('statusFilter').value.toLowerCase().trim();

      let filtered = allOrders.filter(o => {
        const rowDateIso = o.timestamp ? new Date(o.timestamp).toISOString().split('T')[0] : '';
        const rowStatus = (o.orderStatus || 'Pending').toLowerCase();
        const rowPriority = (o.priority || 'Normal').toLowerCase();

        if (query) {
          const combined = Object.values(o).join(' ').toLowerCase();
          if (!combined.includes(query)) return false;
        }
        if (dateQuery && rowDateIso !== dateQuery) return false;
        if (priorityQuery && rowPriority !== priorityQuery) return false;
        if (statusQuery && rowStatus !== statusQuery) return false;

        return true;
      });

      renderCards(filtered);
    }

    function getStatusColors(status) {
      if(status === 'Skyway') return { bg: '#d1fae5', text: '#065f46', border: '#10b981' }; 
      if(status === 'Not available') return { bg: '#fee2e2', text: '#991b1b', border: '#ef4444' }; 
      return { bg: '#fef3c7', text: '#92400e', border: '#f59e0b' }; 
    }

    function renderCards(ordersList) {
      if(ordersList.length === 0) {
        cardsContainer.innerHTML = '<div class="loading-status">No matching orders found.</div>';
        document.getElementById('totalOrdersCount').innerText = '0';
        document.getElementById('pendingOrdersCount').innerText = '0';
        document.getElementById('skywayOrdersCount').innerText = '0';
        return;
      }

      cardsContainer.innerHTML = '';
      
      const groupedOrders = {};
      ordersList.forEach(order => {
         if (!groupedOrders[order.orderId]) {
             groupedOrders[order.orderId] = [];
         }
         groupedOrders[order.orderId].push(order);
      });

      let pendingCount = 0;
      let skywayCount = 0;
      let totalGroups = Object.keys(groupedOrders).length;

      for (const [orderId, items] of Object.entries(groupedOrders)) {
         const firstItem = items[0];
         const formattedDate = firstItem.timestamp ? new Date(firstItem.timestamp).toLocaleString('en-IN', {dateStyle: 'medium', timeStyle: 'short'}) : 'N/A';
         const priorityBadge = firstItem.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal';
         const currentStatus = firstItem.orderStatus || 'Pending';
         const colors = getStatusColors(currentStatus);

         if(currentStatus === 'Pending') pendingCount++;
         if(currentStatus === 'Skyway') skywayCount++;

         const itemsHtml = items.map((item, index) => `
            <div class="item-row">
               <span class="item-name">${index + 1}. ${item.product}</span>
               <span class="item-qty">Qty: ${item.qty}</span>
            </div>
         `).join('');

         const cardHtml = `
            <div class="order-card" style="border: 2px solid ${colors.border}; box-shadow: 0 4px 12px ${colors.bg};">
               <div class="order-header">
                  <div>
                     <div class="order-id">${orderId}</div>
                     <div class="order-time">${formattedDate}</div>
                  </div>
                  <span class="${priorityBadge}">${firstItem.priority || 'Normal'}</span>
               </div>
               
               <div>
                  <div class="customer-info">${firstItem.customer}</div>
                  <div class="customer-mobile">📱 ${firstItem.mobile}</div>
               </div>

               <div class="items-box">
                  <div class="items-title">Order Items (${items.length})</div>
                  <!-- Scrollable Area for Items -->
                  <div class="items-list-scroll">
                     ${itemsHtml}
                  </div>
               </div>

               <div class="order-footer">
                  <select class="status-dropdown" data-id="${orderId}" style="background:${colors.bg}; color:${colors.text};">
                     <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                     <option value="Skyway" ${currentStatus === 'Skyway' ? 'selected' : ''}>Skyway</option>
                     <option value="Not available" ${currentStatus === 'Not available' ? 'selected' : ''}>Not available</option>
                  </select>
               </div>
            </div>
         `;
         cardsContainer.innerHTML += cardHtml;
      }

      document.getElementById('totalOrdersCount').innerText = totalGroups;
      document.getElementById('pendingOrdersCount').innerText = pendingCount;
      document.getElementById('skywayOrdersCount').innerText = skywayCount;
    }

    cardsContainer.addEventListener('change', (e) => {
      if(e.target.classList.contains('status-dropdown')) {
        const orderId = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        const selectEl = e.target;
        const parentCard = selectEl.closest('.order-card');
        
        selectEl.classList.add('status-saving');
        
        fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: newStatus })
        })
        .then(() => {
          const colors = getStatusColors(newStatus);
          selectEl.style.background = colors.bg;
          selectEl.style.color = colors.text;
          
          if(parentCard) {
             parentCard.style.border = `2px solid ${colors.border}`;
             parentCard.style.boxShadow = `0 4px 12px ${colors.bg}`;
          }
          
          allOrders.forEach(o => { if(o.orderId === orderId) o.orderStatus = newStatus; });
          
          let pCount=0, sCount=0;
          const uniqueIds = new Set();
          allOrders.forEach(o => {
             if(!uniqueIds.has(o.orderId)) {
                uniqueIds.add(o.orderId);
                if((o.orderStatus||'Pending') === 'Pending') pCount++;
                if(o.orderStatus === 'Skyway') sCount++;
             }
          });
          document.getElementById('pendingOrdersCount').innerText = pCount;
          document.getElementById('skywayOrdersCount').innerText = sCount;
        })
        .catch(err => alert("Error updating status."))
        .finally(() => { selectEl.classList.remove('status-saving'); });
      }
    });

    document.getElementById('globalSearchInput').addEventListener('input', applyFilters);
    document.getElementById('dateFilterInput').addEventListener('change', applyFilters);
    document.getElementById('priorityFilter').addEventListener('change', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('dateFilterInput').value = '';
      document.getElementById('priorityFilter').value = '';
      document.getElementById('statusFilter').value = '';
      applyFilters();
    });

    document.getElementById('fetchDataBtn').addEventListener('click', fetchLiveOrders);

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      if(!allOrders.length) return alert('No data to export.');
      const header = ['Date Time', 'Order ID', 'Customer Name', 'Mobile', 'Product Name', 'Qty', 'Priority', 'Order Status'];
      const csvRows = [header.join(',')];
      allOrders.forEach(row => {
        const dateStr = row.timestamp ? new Date(row.timestamp).toLocaleString('en-IN') : 'N/A';
        const currentStatus = row.orderStatus || 'Pending';
        const formattedRow = [`"${dateStr}"`, `"${row.orderId || ''}"`, `"${row.customer || ''}"`, `"${row.mobile || ''}"`, `"${row.product || ''}"`, `"${row.qty || '0'}"`, `"${row.priority || 'Normal'}"`, `"${currentStatus}"`];
        csvRows.push(formattedRow.join(','));
      });
      const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Pharma_Orders_' + new Date().toISOString().split('T')[0] + '.csv';
      a.click();
    });

    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
