<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ERP protected Pharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // 🛡️ SECURE TOKEN CHECK
    const myToken = sessionStorage.getItem('pharmaAdminToken');
    const currentAdminUser = sessionStorage.getItem('pharmaCurrentUsername') || 'User';
    if (!myToken) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
    }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text-main); }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); }
    
    /* Premium Header Style */
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; }
    h1 { margin: 0 0 4px; color: var(--text-main); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0; font-size: 14px; }
    
    /* 👤 PROFILE DROPDOWN STYLES */
    .profile-container { position: relative; display: inline-block; }
    .profile-btn { background: #fff; border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: all 0.2s; }
    .profile-btn:hover { background: #f8fafc; border-color: var(--primary); }
    .profile-btn .avatar { background: #ccfbf1; color: var(--primary); padding: 4px 8px; border-radius: 8px; font-size: 14px; }
    .profile-dropdown { display: none; position: absolute; right: 0; top: 52px; background: #fff; border: 1px solid var(--border); border-radius: 12px; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000; padding: 6px; }
    .dropdown-item { width: 100%; padding: 10px 14px; border: none; background: none; text-align: left; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-main); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-sizing: border-box; }
    .dropdown-item:hover { background: #f1f5f9; color: var(--primary); }
    .dropdown-item.logout-item { color: #991b1b; }
    .dropdown-item.logout-item:hover { background: #fee2e2; }
    
    /* 🛠️ MODAL OVERLAY STYLES (Add User/Change Pass) */
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; box-sizing: border-box; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { margin: 0; font-size: 18px; font-weight: 800; color: var(--text-main); }
    .modal-close { background: none; border: none; font-size: 20px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .modal-close:hover { color: #000; }
    
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; position: relative; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    
    .refresh-indicator { position: absolute; top: 20px; right: 20px; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

    .controls-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
    .filters-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .actions-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; }
    .input-box { flex: 1; min-width: 200px; }
    .filter-box { min-width: 150px; }
    input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-main); background: #fff; outline: none; font-family: inherit; box-sizing: border-box; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    
    .btn { padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: inherit; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: #fff; color: var(--text-main); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f1f5f9; }
    
    .order-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .order-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; border-top: 6px solid var(--primary); transition: transform 0.2s; }
    .order-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .order-id { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; }
    .order-time { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .customer-info { font-weight: 700; color: var(--text-main); font-size: 16px; }
    .customer-mobile { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
    
    .items-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
    .items-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.05em; }
    .items-list-scroll { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
    .items-list-scroll::-webkit-scrollbar { width: 5px; }
    .items-list-scroll::-webkit-scrollbar-track { background: transparent; }
    .items-list-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .items-list-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .item-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-name { font-weight: 600; color: #334155; flex: 1; padding-right: 10px; }
    .item-qty { font-weight: 800; color: var(--primary); background: #e2e8f0; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    
    .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-normal { background: #f1f5f9; color: #475569; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    .status-dropdown { border: 2px solid transparent; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; width: 150px; transition: all 0.2s; }
    .status-saving { opacity: 0.5; pointer-events: none; }
    .loading-status { text-align: center; padding: 50px; color: var(--text-muted); font-weight: 600; font-size: 16px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <div>
        <h1>🔒 Protected Admin Dashboard</h1>
        <p>Security Node Online</p>
      </div>
      
      <!-- 👤 NEW PROFILE DROPDOWN COMPONENT -->
      <div class="profile-container">
        <button class="profile-btn" id="profileToggleBtn">
          <span class="avatar">👤</span>
          <span id="welcomeUser">User</span>
          <span style="font-size:10px; margin-left:2px;">▼</span>
        </button>
        <div class="profile-dropdown" id="profileDropdownMenu">
          <button class="dropdown-item" id="openUserModalBtn">🔑 Manage Users & Pass</button>
          <hr style="border:0; border-top:1px solid var(--border); margin:4px 0;">
          <button class="dropdown-item logout-item" id="logoutBtn">🚪 Logout Securely</button>
        </div>
      </div>
    </div>

    <!-- 🛠️ HIDDEN MODERN POPUP FOR USER MANAGEMENT -->
    <div class="modal-backdrop" id="userModalBackdrop">
       <div class="modal-box">
          <div class="modal-header">
             <h3 class="modal-title">👥 User & Password Manager</h3>
             <button class="modal-close" id="closeUserModalBtn">&times;</button>
          </div>
          <p style="font-size: 12px; margin: 0 0 16px; color: var(--text-muted); line-height: 1.5;">
             નવો સ્ટાફ આઈડી બનાવવા માટે નવું નામ લખો. <br><b>મેઈન એડમિનનો પાસવર્ડ બદલવા માટે User ID માં "admin" લખો.</b>
          </p>
          <div style="display:flex; flex-direction:column; gap:14px;">
             <div>
                <label style="font-size:12px; font-weight:700; color:var(--text-main);">User ID</label>
                <input type="text" id="targetUserid" placeholder="e.g. admin or staff1" style="margin-top:4px;">
             </div>
             <div>
                <label style="font-size:12px; font-weight:700; color:var(--text-main);">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter New Password" style="margin-top:4px;">
             </div>
             <button class="btn btn-primary" id="saveUserBtn">💾 Save Changes</button>
             <div id="userActionStatus" style="font-size: 13px; font-weight: 700; display: none; text-align:center; padding: 8px; border-radius: 8px;"></div>
          </div>
       </div>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="refresh-indicator" title="Live Auto-Refresh Active"></div>
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="totalOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" style="color:#d97706;" id="pendingOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Skyway (Clear)</span>
        <span class="stat-value" style="color:#059669;" id="skywayOrdersCount">0</span>
      </div>
    </div>

    <div class="controls-panel">
      <div class="filters-row">
        <div class="input-box" style="flex: 2;">
          <input type="text" id="globalSearchInput" placeholder="🔍 Search Name, Mobile, Product or ID...">
        </div>
        <div class="filter-box"><input type="date" id="dateFilterInput" title="Select Date"></div>
        <div class="filter-box">
          <select id="priorityFilter">
            <option value="">All Priorities</option>
            <option value="Normal">Normal</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="filter-box">
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Skyway">Skyway</option>
            <option value="Not available">Not available</option>
          </select>
        </div>
      </div>
      
      <div class="actions-row">
        <button class="btn btn-ghost" id="resetFiltersBtn">🧹 Reset Filters</button>
        <button class="btn btn-ghost" id="fetchDataBtn">🔄 Refresh Data</button>
      </div>
    </div>

    <div id="cardsContainer" class="order-cards-container">
       <div class="loading-status">🔄 Authenticating & Fetching Secure Data...</div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSPOJkI7OD76N17vZboLVXtrE0JHmJi19EdHauZtsmfN5UsVkIDkfk2qhu6g0ycFY4/exec";
    
    document.getElementById('welcomeUser').innerText = currentAdminUser;

    // 👤 PROFILE DROPDOWN TOGGLE LOGIC
    const profileToggleBtn = document.getElementById('profileToggleBtn');
    const profileDropdownMenu = document.getElementById('profileDropdownMenu');
    
    profileToggleBtn.addEventListener('click', (e) => {
       e.stopPropagation();
       profileDropdownMenu.style.display = profileDropdownMenu.style.display === 'block' ? 'none' : 'block';
    });
    
    document.addEventListener('click', () => {
       profileDropdownMenu.style.display = 'none';
    });

    // 🛠️ MODAL OPEN/CLOSE LOGIC
    const userModalBackdrop = document.getElementById('userModalBackdrop');
    document.getElementById('openUserModalBtn').addEventListener('click', () => {
       userModalBackdrop.style.display = 'flex';
    });
    document.getElementById('closeUserModalBtn').addEventListener('click', () => {
       userModalBackdrop.style.display = 'none';
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
       sessionStorage.removeItem('pharmaAdminToken');
       sessionStorage.removeItem('pharmaCurrentUsername');
       window.location.href = 'login.html';
    });

    // LIVE USER MANAGEMENT / PASSWORD CHANGE
    document.getElementById('saveUserBtn').addEventListener('click', () => {
       const targetId = document.getElementById('targetUserid').value.trim();
       const newPass = document.getElementById('newPassword').value.trim();
       const statusDiv = document.getElementById('userActionStatus');
       const btn = document.getElementById('saveUserBtn');

       if(!targetId || !newPass) {
          statusDiv.style.display = "block";
          statusDiv.style.background = "#fee2e2";
          statusDiv.style.color = "#991b1b";
          statusDiv.innerText = "⚠️ ID અને પાસવર્ડ બંને લખો!";
          return;
       }

       btn.innerText = "Processing...";
       btn.disabled = true;

       fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ 
             action: 'manageUser', 
             token: myToken, 
             targetUserid: targetId, 
             newPassword: newPass 
          })
       })
       .then(res => res.json())
       .then(data => {
          statusDiv.style.display = "block";
          if(data.status === 'success') {
             statusDiv.style.background = "#d1fae5";
             statusDiv.style.color = "#065f46";
             statusDiv.innerText = "✅ " + data.message;
             document.getElementById('targetUserid').value = '';
             document.getElementById('newPassword').value = '';
             setTimeout(() => { userModalBackdrop.style.display = 'none'; }, 1500);
          } else {
             statusDiv.style.background = "#fee2e2";
             statusDiv.style.color = "#991b1b";
             statusDiv.innerText = "❌ ભૂલ: " + data.message;
          }
       })
       .catch(err => {
          statusDiv.style.display = "block";
          statusDiv.style.background = "#fee2e2";
          statusDiv.style.color = "#991b1b";
          statusDiv.innerText = "❌ સર્વર કનેક્શન ફેલ થયું!";
       })
       .finally(() => {
          btn.innerText = "💾 Save Changes";
          btn.disabled = false;
          setTimeout(() => { statusDiv.style.display = "none"; }, 3000);
       });
    });

    const cardsContainer = document.getElementById('cardsContainer');
    let allOrders = [];

    // Fetch Orders
    function fetchLiveOrders() {
      cardsContainer.innerHTML = '<div class="loading-status">🔄 Verifying Token & Fetching Data...</div>';
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'fetchOrders', token: myToken })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'unauthorized') {
            alert("Security Error: Invalid Session.");
            document.getElementById('logoutBtn').click();
            return;
        }
        if(data.status === "error" || !Array.isArray(data.data) || data.data.length === 0) {
          cardsContainer.innerHTML = '<div class="loading-status" style="color:#b42318;">No data found. Please wait for new orders.</div>';
          return;
        }
        allOrders = data.data; 
        allOrders.reverse();
        applyFilters();
      })
      .catch(err => {
        cardsContainer.innerHTML = '<div class="loading-status" style="color:#b42318;">Connection error. Secure Fetch Failed.</div>';
      });
    }

    // Silent Auto Refresh
    function fetchOrdersQuietly() {
       fetch(WEB_APP_URL, {
         method: 'POST',
         headers: { 'Content-Type': 'text/plain;charset=utf-8' },
         body: JSON.stringify({ action: 'fetchOrders', token: myToken })
       })
       .then(res => res.json())
       .then(data => {
         if(data.status === 'success' && Array.isArray(data.data) && data.data.length > 0) {
            if (!document.querySelector('.status-saving')) {
               allOrders = data.data;
               allOrders.reverse();
               applyFilters();
            }
         } else if (data.status === 'unauthorized') {
            document.getElementById('logoutBtn').click();
         }
       })
       .catch(err => console.log("Silent update failed"));
    }
    
    setInterval(fetchOrdersQuietly, 30000); 

    function applyFilters() {
      const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
      const dateQuery = document.getElementById('dateFilterInput').value;
      const priorityQuery = document.getElementById('priorityFilter').value.toLowerCase().trim();
      const statusQuery = document.getElementById('statusFilter').value.toLowerCase().trim();

      let filtered = allOrders.filter(o => {
        const rowDateIso = o.timestamp ? new Date(o.timestamp).toISOString().split('T')[0] : '';
        const rowStatus = (o.orderStatus || 'Pending').toLowerCase();
        const rowPriority = (o.priority || 'Normal').toLowerCase();

        if (query) {
          const combined = Object.values(o).join(' ').toLowerCase();
          if (!combined.includes(query)) return false;
        }
        if (dateQuery && rowDateIso !== dateQuery) return false;
        if (priorityQuery && rowPriority !== priorityQuery) return false;
        if (statusQuery && rowStatus !== statusQuery) return false;

        return true;
      });

      renderCards(filtered);
    }

    function getStatusColors(status) {
      if(status === 'Skyway') return { bg: '#d1fae5', text: '#065f46', border: '#10b981' }; 
      if(status === 'Not available') return { bg: '#fee2e2', text: '#991b1b', border: '#ef4444' }; 
      return { bg: '#fef3c7', text: '#92400e', border: '#f59e0b' }; 
    }

    function renderCards(ordersList) {
      if(ordersList.length === 0) {
        cardsContainer.innerHTML = '<div class="loading-status">No matching orders found.</div>';
        document.getElementById('totalOrdersCount').innerText = '0';
        document.getElementById('pendingOrdersCount').innerText = '0';
        document.getElementById('skywayOrdersCount').innerText = '0';
        return;
      }

      cardsContainer.innerHTML = '';
      const groupedOrders = {};
      ordersList.forEach(order => {
         if (!groupedOrders[order.orderId]) {
             groupedOrders[order.orderId] = [];
         }
         groupedOrders[order.orderId].push(order);
      });

      let pendingCount = 0;
      let skywayCount = 0;
      let totalGroups = Object.keys(groupedOrders).length;

      for (const [orderId, items] of Object.entries(groupedOrders)) {
         const firstItem = items[0];
         const formattedDate = firstItem.timestamp ? new Date(firstItem.timestamp).toLocaleString('en-IN', {dateStyle: 'medium', timeStyle: 'short'}) : 'N/A';
         const priorityBadge = firstItem.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal';
         const currentStatus = firstItem.orderStatus || 'Pending';
         const colors = getStatusColors(currentStatus);
         
         const fileBadge = firstItem.fileUrl ? `<a href="${firstItem.fileUrl}" target="_blank" style="background:#e0f2fe; color:#0369a1; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; margin-left:12px;">📎 View File</a>` : '';

         if(currentStatus === 'Pending') pendingCount++;
         if(currentStatus === 'Skyway') skywayCount++;

         const itemsHtml = items.map((item, index) => `
            <div class="item-row">
               <span class="item-name">${index + 1}. ${item.product}</span>
               <span class="item-qty">Qty: ${item.qty}</span>
            </div>
         `).join('');

         const cardHtml = `
            <div class="order-card" style="border: 2px solid ${colors.border}; box-shadow: 0 4px 12px ${colors.bg};">
               <div class="order-header">
                  <div>
                     <div class="order-id">${orderId} ${fileBadge}</div>
                     <div class="order-time">${formattedDate}</div>
                  </div>
                  <span class="${priorityBadge}">${firstItem.priority || 'Normal'}</span>
               </div>
               
               <div>
                  <div class="customer-info">${firstItem.customer}</div>
                  <div class="customer-mobile">📱 ${firstItem.mobile}</div>
               </div>

               <div class="items-box">
                  <div class="items-title">Order Items (${items.length})</div>
                  <div class="items-list-scroll">
                     ${itemsHtml}
                  </div>
               </div>

               <div class="order-footer">
                  <select class="status-dropdown" data-id="${orderId}" style="background:${colors.bg}; color:${colors.text};">
                     <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                     <option value="Skyway" ${currentStatus === 'Skyway' ? 'selected' : ''}>Skyway</option>
                     <option value="Not available" ${currentStatus === 'Not available' ? 'selected' : ''}>Not available</option>
                  </select>
               </div>
            </div>
         `;
         cardsContainer.innerHTML += cardHtml;
      }

      document.getElementById('totalOrdersCount').innerText = totalGroups;
      document.getElementById('pendingOrdersCount').innerText = pendingCount;
      document.getElementById('skywayOrdersCount').innerText = skywayCount;
    }

    // Status Update Listener
    cardsContainer.addEventListener('change', (e) => {
      if(e.target.classList.contains('status-dropdown')) {
        const orderId = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        const selectEl = e.target;
        const parentCard = selectEl.closest('.order-card');
        selectEl.classList.add('status-saving');
        
        fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: newStatus, token: myToken })
        })
        .then(res => res.json())
        .then(data => {
          if(data.status === 'unauthorized') {
              alert("Security Error!");
              document.getElementById('logoutBtn').click();
              return;
          }
          const colors = getStatusColors(newStatus);
          selectEl.style.background = colors.bg;
          selectEl.style.color = colors.text;
          if(parentCard) {
             parentCard.style.border = `2px solid ${colors.border}`;
             parentCard.style.boxShadow = `0 4px 12px ${colors.bg}`;
          }
          allOrders.forEach(o => { if(o.orderId === orderId) o.orderStatus = newStatus; });
          let pCount=0, sCount=0;
          const uniqueIds = new Set();
          allOrders.forEach(o => {
             if(!uniqueIds.has(o.orderId)) {
                uniqueIds.add(o.orderId);
                if((o.orderStatus||'Pending') === 'Pending') pCount++;
                if(o.orderStatus === 'Skyway') sCount++;
             }
          });
          document.getElementById('pendingOrdersCount').innerText = pCount;
          document.getElementById('skywayOrdersCount').innerText = sCount;
        })
        .catch(err => alert("Error updating status."))
        .finally(() => { selectEl.classList.remove('status-saving'); });
      }
    });

    document.getElementById('globalSearchInput').addEventListener('input', applyFilters);
    document.getElementById('dateFilterInput').addEventListener('change', applyFilters);
    document.getElementById('priorityFilter').addEventListener('change', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);

    document.getElementById('resetFiltersBtn').addEventListener('click', () => {
      document.getElementById('globalSearchInput').value = '';
      document.getElementById('dateFilterInput').value = '';
      document.getElementById('priorityFilter').value = '';
      document.getElementById('statusFilter').value = '';
      applyFilters();
    });

    document.getElementById('fetchDataBtn').addEventListener('click', fetchLiveOrders);
    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
