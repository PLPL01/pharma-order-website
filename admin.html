<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - Premium ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    const myToken = sessionStorage.getItem('pharmaAdminToken');
    const currentAdminUser = sessionStorage.getItem('pharmaCurrentUsername') || 'User';
    const currentUserRole = sessionStorage.getItem('pharmaUserRole') || 'Staff'; 
    if (!myToken) { window.location.href = 'login.html'; }
    const savedTheme = localStorage.getItem('pharmaTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05); --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
      --card-bg: #fff; --btn-ghost-bg: #fff; --btn-action-bg: #e2e8f0; --item-bg: #f8fafc;
    }
    /* મોડર્ન ડેટ પીકર સ્ટાઇલ */
    .modern-datepicker {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        padding: 12px 16px !important;
        font-family: 'Inter', sans-serif !important;
        font-weight: 600 !important;
        color: var(--text-main) !important;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-sm);
    }
    .modern-datepicker:hover { border-color: var(--primary) !important; }
    
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text-main); transition: 0.3s; }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); }
    /* બાકીની સ્ટાઇલ અગાઉ મુજબ છે... */
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; font-weight: 800; }
    .order-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .order-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; border-top: 6px solid var(--primary); }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <div><h1>🔒 Premium Admin Panel</h1><p>Syncing Live Data...</p></div>
      <button class="theme-btn" id="themeToggleBtn">☀️</button>
    </div>

    <div class="controls-panel">
      <div class="filters-row">
        <div class="filter-box"><input type="date" id="dateFilterInput" class="modern-datepicker"></div>
        <input type="text" id="globalSearchInput" placeholder="🔍 Search...">
      </div>
    </div>

    <div id="cardsContainer" class="order-cards-container"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRju9C_1S14BJcPlRyOCnb03vjvqGx1ZdSPu3X8_PicTLSCpWHv4T2tn3OtP7hJ07E/exec";
    
    // કેલેન્ડર પર ક્લિક કરતા જ મોડર્ન ડ્રોપડાઉન ખુલે તે માટે
    document.getElementById('dateFilterInput').addEventListener('focus', function() { this.showPicker(); });

    function applyFilters() {
      const dateQuery = document.getElementById('dateFilterInput').value;
      const search = document.getElementById('globalSearchInput').value.toLowerCase();

      let filtered = allOrders.filter(o => {
        let orderDate = o.timestamp ? new Date(o.timestamp).toISOString().split('T')[0] : '';
        let dateMatch = !dateQuery || orderDate === dateQuery;
        let searchMatch = !search || Object.values(o).join(' ').toLowerCase().includes(search);
        return dateMatch && searchMatch;
      });
      renderCards(filtered);
    }

    // ઓટો-રિફ્રેશ લોજિક (20 સેકન્ડ)
    function fetchLiveOrders(isAutoRefresh = false) {
      fetch(WEB_APP_URL + "?t=" + new Date().getTime(), { 
          method: 'POST', 
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'fetchOrders', token: myToken }) 
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
            allOrders = data.data.reverse();
            applyFilters();
        }
      });
    }

    document.getElementById('dateFilterInput').addEventListener('change', applyFilters);
    document.getElementById('globalSearchInput').addEventListener('input', applyFilters);

    document.addEventListener('DOMContentLoaded', () => { 
        fetchLiveOrders(false); 
        setInterval(() => fetchLiveOrders(true), 20000); 
    });
    
    // ... બાકીનું renderCards અને અન્ય ફંક્શન્સ અગાઉ મુજબ ...
  </script>
</body>
</html>
