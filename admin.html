<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script>
    const myToken = sessionStorage.getItem('pharmaAdminToken');
    const currentAdminUser = sessionStorage.getItem('pharmaCurrentUsername') || 'User';
    const currentUserRole = sessionStorage.getItem('pharmaUserRole') || 'Staff'; 
    if (!myToken) window.location.href = 'login.html';
  </script>
  <style>
    /* CSS code puranu j che, mobile responsive, full screen width */
    body { font-family: sans-serif; background: #f0fdfa; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
    .order-cards-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .btn-action { padding: 5px 10px; cursor: pointer; }
    .admin-only { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dashboard</h1>
    <button class="admin-only" id="exportExcelBtn">📥 Export Excel</button>
    <div id="cardsContainer">Loading...</div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbznm1w4OTRlnrO1VwMv1vUHSlo2vrMgieVLowjte4lCR2_lwvSbHiigFBJy3OnjSes-/exec";
    const isAdmin = (currentUserRole === 'Admin' || currentUserRole === 'admin');
    if(isAdmin) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');

    let allOrders = [];
    const cardsContainer = document.getElementById('cardsContainer');

    function fetchLiveOrders() {
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'fetchOrders', token: myToken }) })
      .then(res => res.json()).then(data => {
        if(data.status === 'success') { allOrders = data.data.reverse(); renderCards(allOrders); }
      });
    }

    function renderCards(ordersList) {
      cardsContainer.innerHTML = '';
      const grouped = {};
      ordersList.forEach(o => { if(!grouped[o.orderId]) grouped[o.orderId] = []; grouped[o.orderId].push(o); });
      
      for (const [id, items] of Object.entries(grouped)) {
         const first = items[0];
         cardsContainer.innerHTML += `
            <div class="order-card">
               <div><b>${id}</b> - ${first.customer}</div>
               <div class="items-box">${items.map(i => `<div>${i.product} (Qty: ${i.qty})</div>`).join('')}</div>
               <select onchange="updateStatus('${id}', this.value)">
                  <option value="Pending" ${first.orderStatus==='Pending'?'selected':''}>Pending</option>
                  <option value="Skyway" ${first.orderStatus==='Skyway'?'selected':''}>Skyway</option>
               </select>
               ${isAdmin ? `<button class="btn-action" onclick="showAuditLog('${id}')">🕵️‍♂️ Log</button>` : ''}
            </div>`;
      }
    }

    function updateStatus(orderId, status) {
       fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', orderId, status, token: myToken, username: currentAdminUser }) })
       .then(() => fetchLiveOrders());
    }

    // Export Excel Logic
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
       let csv = "data:text/csv;charset=utf-8,ID,Customer,Product,Qty,Status,ProcessedBy\n";
       allOrders.forEach(o => { csv += `${o.orderId},${o.customer},${o.product},${o.qty},${o.orderStatus},${o.processedBy}\n`; });
       var link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", "Orders.csv"); document.body.appendChild(link); link.click();
    });

    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
