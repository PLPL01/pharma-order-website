<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pharma Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0fdfa;
      --surface: #ffffff;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(15, 118, 110, 0.05), 0 8px 10px -6px rgba(15, 118, 110, 0.05);
    }
    
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 30px;
      color: var(--text-main);
    }
    
    .card {
      max-width: 1400px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow-lg);
    }
    
    .header-section {
      margin-bottom: 24px;
    }
    
    h1 { 
      margin: 0 0 8px; 
      color: var(--text-main); 
      font-size: 32px; 
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    
    p { 
      color: var(--text-muted); 
      margin: 0; 
      font-size: 15px; 
    }
    
    /* Modern Stats Cards */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 8px; }

    /* Modern Controls & Filters */
    .controls-panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    
    .actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .input-box {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    
    .filter-box {
      min-width: 150px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      background: #fff;
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    
    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
    }
    
    /* Modern Buttons */
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(15, 118, 110, 0.2); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(15, 118, 110, 0.3); }
    
    .btn-ghost { background: #fff; color: var(--text-main); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f1f5f9; border-color: #cbd5e1; }
    
    /* Modern Table */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    thead { 
      background: #f8fafc; 
    }
    th {
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
      padding: 16px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      color: var(--text-main);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f0fdfa; }
    
    /* Badges */
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }
    .badge-normal { background: #f1f5f9; color: #475569; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    
    /* Status Dropdown inside Table */
    .status-dropdown {
      border: 2px solid transparent;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      width: 140px;
      transition: all 0.2s;
    }
    .status-dropdown:focus {
      border-color: var(--text-main);
    }
    .status-saving { opacity: 0.5; pointer-events: none; }

    .loading-status {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <h1>Admin Dashboard</h1>
      <p>Modern Live Orders Tracker & Management System</p>
    </div>

    <!-- Analytics Cards -->
    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="totalOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" style="color:#d97706;" id="pendingOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Skyway (Clear)</span>
        <span class="stat-value" style="color:#059669;" id="skywayOrdersCount">0</span>
      </div>
    </div>

    <!-- Controls & Filters Panel -->
    <div class="controls-panel">
      <div class="filters-row">
        <div class="input-box" style="flex: 2;">
          <input type="text" id="globalSearchInput" placeholder="🔍 Search Name, Mobile, Product or ID...">
        </div>
        <div class="filter-box">
          <input type="date" id="dateFilterInput" title="Select Date">
        </div>
        <div class="filter-box">
          <select id="priorityFilter">
            <option value="">All Priorities</option>
            <option value="Normal">Normal</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
        <div class="filter-box">
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Skyway">Skyway</option>
            <option value="Not available">Not available</option>
          </select>
        </div>
      </div>
      
      <div class="actions-row">
        <button class="btn btn-ghost" id="resetFiltersBtn">🧹 Reset Filters</button>
        <button class="btn btn-ghost" id="fetchDataBtn">🔄 Refresh Data</button>
        <button class="btn btn-primary" id="exportCsvBtn">📥 Export to Excel</button>
        <a class="btn btn-ghost" href="index.html" target="_blank">View Customer Page</a>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Mobile</th>
            <th>Product Name</th>
            <th>Qty</th>
            <th>Priority</th>
            <th>Order Status</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr>
            <td colspan="8" class="loading-status">🔄 Fetching fresh data from Server...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxWmU2xKySlRSHcCp-bs7xYFhoLdHOs08-nVxb9yuIz37UbVPOq9hSYHfS3uVEcTbo8/exec";

    const tbody = document.getElementById('adminTableBody');
    const fetchDataBtn = document.getElementById('fetchDataBtn');
    const resetFiltersBtn = document.getElementById('resetFiltersBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    
    // Filter Elements
    const searchInput = document.getElementById('globalSearchInput');
    const dateInput = document.getElementById('dateFilterInput');
    const priorityInput = document.getElementById('priorityFilter');
    const statusInput = document.getElementById('statusFilter');
    
    let allOrders = [];

    // Fetch data from server
    function fetchLiveOrders() {
      tbody.innerHTML = '<tr><td colspan="8" class="loading-status">🔄 Downloading live data from Google Sheet...</td></tr>';
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if(data.status === "error" || !Array.isArray(data)) {
            tbody.innerHTML = '<tr><td colspan="8" class="loading-status" style="color:#b42318;">No data found. Please wait for new orders.</td></tr>';
            return;
          }
          allOrders = data;
          allOrders.reverse(); // Newest first
          applyFilters();
        })
        .catch(err => {
          tbody.innerHTML = '<tr><td colspan="8" class="loading-status" style="color:#b42318;">Connection error. Check Internet.</td></tr>';
        });
    }

    // Filtering Logic
    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const dateQuery = dateInput.value;
      const priorityQuery = priorityInput.value.toLowerCase().trim();
      const statusQuery = statusInput.value.toLowerCase().trim();

      let filtered = allOrders.filter(o => {
        const rowDateIso = o.timestamp ? new Date(o.timestamp).toISOString().split('T')[0] : '';
        const rowStatus = (o.orderStatus || 'Pending').toLowerCase();
        const rowPriority = (o.priority || 'Normal').toLowerCase();

        // 1. Search Box
        if (query) {
          const combined = Object.values(o).join(' ').toLowerCase();
          if (!combined.includes(query)) return false;
        }
        
        // 2. Date Filter
        if (dateQuery && rowDateIso !== dateQuery) return false;

        // 3. Priority Filter
        if (priorityQuery && rowPriority !== priorityQuery) return false;

        // 4. Status Filter
        if (statusQuery && rowStatus !== statusQuery) return false;

        return true;
      });

      updateDashboard(filtered);
    }

    function getStatusColors(status) {
      if(status === 'Skyway') return { bg: '#d1fae5', text: '#065f46' }; // Modern Emerald
      if(status === 'Not available') return { bg: '#fee2e2', text: '#991b1b' }; // Modern Red
      return { bg: '#fef3c7', text: '#92400e' }; // Modern Amber/Yellow for Pending
    }

    function updateDashboard(ordersList) {
      if(ordersList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="loading-status">No matching orders found.</td></tr>';
        document.getElementById('totalOrdersCount').innerText = '0';
        document.getElementById('pendingOrdersCount').innerText = '0';
        document.getElementById('skywayOrdersCount').innerText = '0';
        return;
      }

      tbody.innerHTML = ordersList.map(row => {
        const formattedDate = row.timestamp ? new Date(row.timestamp).toLocaleString('en-IN') : 'N/A';
        const priorityBadge = row.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal';
        
        const currentStatus = row.orderStatus || 'Pending';
        const colors = getStatusColors(currentStatus);

        return `
          <tr>
            <td style="color: var(--text-muted); font-size:13px;">${formattedDate}</td>
            <td style="font-weight: 800; color: var(--primary);">${row.orderId || 'N/A'}</td>
            <td style="font-weight: 600;">${row.customer || 'N/A'}</td>
            <td style="font-weight: 500;">${row.mobile || 'N/A'}</td>
            <td style="font-weight: 600; color: #334155;">${row.product || 'N/A'}</td>
            <td style="font-size: 15px;"><strong>${row.qty || '0'}</strong></td>
            <td><span class="${priorityBadge}">${row.priority || 'Normal'}</span></td>
            <td>
              <select class="status-dropdown" data-id="${row.orderId}" style="background:${colors.bg}; color:${colors.text};">
                <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Skyway" ${currentStatus === 'Skyway' ? 'selected' : ''}>Skyway</option>
                <option value="Not available" ${currentStatus === 'Not available' ? 'selected' : ''}>Not available</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('totalOrdersCount').innerText = ordersList.length;
      document.getElementById('pendingOrdersCount').innerText = ordersList.filter(o => (o.orderStatus||'Pending') === 'Pending').length;
      document.getElementById('skywayOrdersCount').innerText = ordersList.filter(o => o.orderStatus === 'Skyway').length;
    }

    // Database Status Update Handler
    tbody.addEventListener('change', (e) => {
      if(e.target.classList.contains('status-dropdown')) {
        const orderId = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        const selectEl = e.target;
        
        selectEl.classList.add('status-saving');
        
        fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: newStatus }),
          mode: 'no-cors'
        })
        .then(() => {
          const colors = getStatusColors(newStatus);
          selectEl.style.background = colors.bg;
          selectEl.style.color = colors.text;
          
          allOrders.forEach(o => {
            if(o.orderId === orderId) o.orderStatus = newStatus;
          });
          
          document.getElementById('pendingOrdersCount').innerText = allOrders.filter(o => (o.orderStatus||'Pending') === 'Pending').length;
          document.getElementById('skywayOrdersCount').innerText = allOrders.filter(o => o.orderStatus === 'Skyway').length;
        })
        .catch(err => alert("Error updating status in database."))
        .finally(() => {
          selectEl.classList.remove('status-saving');
        });
      }
    });

    // Event Listeners for Filters
    searchInput.addEventListener('input', applyFilters);
    dateInput.addEventListener('change', applyFilters);
    priorityInput.addEventListener('change', applyFilters);
    statusInput.addEventListener('change', applyFilters);

    // Reset Filters Button
    resetFiltersBtn.addEventListener('click', () => {
      searchInput.value = '';
      dateInput.value = '';
      priorityInput.value = '';
      statusInput.value = '';
      applyFilters();
    });

    // Fetch Button
    fetchDataBtn.addEventListener('click', fetchLiveOrders);

    // Export CSV
    exportCsvBtn.addEventListener('click', () => {
      if(!allOrders.length) return alert('Export karva mate koi data nathi.');
      const header = ['Date Time', 'Order ID', 'Customer Name', 'Mobile', 'Product Name', 'Qty', 'Priority', 'Order Status'];
      const csvRows = [header.join(',')];
      
      allOrders.forEach(row => {
        const dateStr = row.timestamp ? new Date(row.timestamp).toLocaleString('en-IN') : 'N/A';
        const currentStatus = row.orderStatus || 'Pending';
        const formattedRow = [
          `"${dateStr}"`, `"${row.orderId || ''}"`, `"${row.customer || ''}"`, `"${row.mobile || ''}"`,
          `"${row.product || ''}"`, `"${row.qty || '0'}"`, `"${row.priority || 'Normal'}", "${currentStatus}"`
        ];
        csvRows.push(formattedRow.join(','));
      });
      
      const csvContent = csvRows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Pharma_Orders_' + new Date().toISOString().split('T')[0] + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Initial load
    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
