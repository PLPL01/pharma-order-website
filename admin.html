<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body{font-family:sans-serif; background:#f4f8f7; padding:20px;}
    .container{max-width:1000px; margin:auto;}
    .order-card{background:#fff; border-radius:15px; padding:20px; margin-bottom:20px; border-left:5px solid #0f766e; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    .status-select{padding:5px; border-radius:5px; font-weight:bold;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Panel</h1>
    <div id="cards">Loading...</div>
  </div>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxWmU2xKySlRSHcCp-bs7xYFhoLdHOs08-nVxb9yuIz37UbVPOq9hSYHfS3uVEcTbo8/exec";
    async function load() {
      const res = await fetch(WEB_APP_URL);
      const data = await res.json();
      const cards = document.getElementById('cards');
      cards.innerHTML = '';
      const groups = data.reduce((acc, o) => { (acc[o.orderId] = acc[o.orderId] || []).push(o); return acc; }, {});
      for (const [id, items] of Object.entries(groups)) {
        cards.innerHTML += `
          <div class="order-card">
            <h3>Order: ${id} | Customer: ${items[0].customer}</h3>
            ${items.map(i => `<p>${i.product} - ${i.qty}</p>`).join('')}
            <select class="status-select" onchange="updateStatus('${id}', this.value)">
              <option value="Pending" ${items[0].orderStatus=='Pending'?'selected':''}>Pending</option>
              <option value="Skyway" ${items[0].orderStatus=='Skyway'?'selected':''}>Skyway</option>
              <option value="Not available" ${items[0].orderStatus=='Not available'?'selected':''}>Not available</option>
            </select>
          </div>`;
      }
    }
    async function updateStatus(orderId, status) {
      await fetch(WEB_APP_URL, { method:'POST', mode:'no-cors', body:JSON.stringify({action:'updateStatus', orderId, status}) });
    }
    load();
  </script>
</body>
</html>
