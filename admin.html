<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - Premium ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    const myToken = sessionStorage.getItem('pharmaAdminToken');
    const currentAdminUser = sessionStorage.getItem('pharmaCurrentUsername') || 'User';
    const currentUserRole = sessionStorage.getItem('pharmaUserRole') || 'Staff'; 
    if (!myToken) { window.location.href = 'login.html'; }
    const savedTheme = localStorage.getItem('pharmaTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05); --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
      --card-bg: #fff; --btn-ghost-bg: #fff; --btn-action-bg: #e2e8f0; --item-bg: #f8fafc;
    }
    [data-theme="dark"] {
      --bg: #000000; --surface: #0f0f0f; --primary: #14b8a6; --primary-hover: #0d9488;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border: #27272a;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.5); --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.8);
      --card-bg: #0a0a0a; --btn-ghost-bg: #18181b; --btn-action-bg: #27272a; --item-bg: #111111;
    }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text-main); transition: 0.3s; }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); transition: 0.3s; }
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; }
    h1 { margin: 0 0 4px; color: var(--text-main); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0; font-size: 14px; }
    .top-controls { display: flex; gap: 12px; align-items: center; }
    .theme-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; color: var(--text-main); }
    .profile-container { position: relative; display: inline-block; z-index: 100; }
    .profile-btn { background: var(--surface); border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); }
    .profile-btn .avatar { background: rgba(20, 184, 166, 0.2); color: var(--primary); padding: 4px 8px; border-radius: 8px; font-size: 14px; }
    .profile-dropdown { display: none; position: absolute; right: 0; top: 52px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 220px; box-shadow: var(--shadow-lg); z-index: 1000; padding: 6px; }
    .dropdown-item { width: 100%; padding: 10px 14px; border: none; background: none; text-align: left; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-main); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-sizing: border-box; }
    .dropdown-item:hover { background: var(--item-bg); color: var(--primary); }
    .dropdown-item.logout-item { color: #ef4444; }
    .tabs-container { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 15px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 10px; transition: 0.2s; }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3); }
    .quick-filters-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; background: var(--item-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); }
    .quick-btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); cursor: pointer; flex-grow: 1; text-align: center; }
    .quick-btn.active-all { background: var(--text-main); color: var(--bg); border-color: var(--text-main); }
    .quick-btn.active-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border-color: #f59e0b; }
    .quick-btn.active-notavail { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--item-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .controls-panel { background: var(--item-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
    .filters-row, .actions-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .actions-row { justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 16px; }
    .input-box, .filter-box { flex: 1; min-width: 150px; }
    input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--surface); color: var(--text-main); outline: none; box-sizing: border-box; }
    .btn { padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: var(--btn-ghost-bg); color: var(--text-main); border: 1px solid var(--border); }
    .btn-action { background: var(--btn-action-bg); color: var(--text-main); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; margin-left: 8px; }
    .order-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 24px; }
    .order-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; border-top: 6px solid var(--primary); box-sizing: border-box; }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .order-id { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .order-time { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .processed-badge { font-size: 11px; font-weight: 700; color: var(--text-muted); background: var(--btn-action-bg); padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 8px; border: 1px solid var(--border); }
    .customer-info { font-weight: 700; color: var(--text-main); font-size: 16px; display: flex; align-items: center; }
    .customer-mobile { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .items-box { background: var(--item-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-name { font-weight: 600; color: var(--text-main); }
    .item-qty { font-weight: 800; color: var(--primary); background: rgba(20, 184, 166, 0.1); padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-normal { background: var(--btn-action-bg); color: var(--text-main); }
    .badge-urgent { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .status-dropdown { border: 2px solid transparent; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; width: 150px; }
    .skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: 320px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
    .skeleton-line { background: linear-gradient(90deg, var(--item-bg) 25%, var(--border) 50%, var(--item-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; padding: 24px; box-shadow: var(--shadow-lg); box-sizing: border-box; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-close { background: none; border: none; font-size: 20px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .modal-content-scroll { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .history-table th, .history-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; color: var(--text-main); }
    .history-table th { background: var(--item-bg); font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .msg-success { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; }
    .msg-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; }
    @media (max-width: 768px) {
      body { padding: 10px; }
      .card { padding: 15px; border-radius: 12px; }
      .header-section { flex-direction: column; align-items: flex-start; gap: 15px; }
      .top-controls { width: 100%; justify-content: flex-end; }
      .stats-container { grid-template-columns: 1fr; }
      .order-cards-container { gap: 16px; }
      .quick-btn { flex: 1 1 calc(50% - 10px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <div>
        <h1>🔒 Premium Admin Panel</h1>
        <p>Security Node Online <span id="autoRefreshStatus" style="color:var(--primary); font-weight:bold; margin-left:10px;"></span></p>
      </div>
      <div class="top-controls">
        <button class="theme-btn" id="themeToggleBtn">☀️</button>
        <div class="profile-container">
          <button class="profile-btn" id="profileToggleBtn"><span class="avatar">👤</span><span id="welcomeUser">User</span><span style="font-size:10px; margin-left:2px;">▼</span></button>
          <div class="profile-dropdown" id="profileDropdownMenu">
            <button class="dropdown-item admin-only" id="openUserModalBtn">🔑 Manage Staff</button>
            <hr class="admin-only" style="border:0; border-top:1px solid var(--border); margin:4px 0;">
            <button class="dropdown-item logout-item" id="logoutBtn">🚪 Logout Securely</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tabs-container">
       <button class="tab-btn" id="tabToday">📦 Today's Orders</button>
       <button class="tab-btn active" id="tabHistory">📜 Order History</button>
    </div>

    <div class="quick-filters-row">
       <span style="font-size:13px; font-weight:800; color:var(--text-muted); text-transform:uppercase; width: 100%; margin-bottom: 4px;">🔍 Quick Filter:</span>
       <button class="quick-btn active-all" id="quickAllBtn">📁 All Orders</button>
       <button class="quick-btn" id="quickPendingBtn">🟡 Pending</button>
       <button class="quick-btn" id="quickNotAvailBtn">🔴 Not Available</button>
    </div>

    <div class="stats-container">
      <div class="stat-card"><span class="stat-label">Total Orders</span><span class="stat-value" id="totalOrdersCount">0</span></div>
      <div class="stat-card"><span class="stat-label">Pending</span><span class="stat-value" style="color:#f59e0b;" id="pendingOrdersCount">0</span></div>
      <div class="stat-card"><span class="stat-label">Skyway (Clear)</span><span class="stat-value" style="color:#10b981;" id="skywayOrdersCount">0</span></div>
    </div>

    <div class="controls-panel" id="controlsPanel" style="display: block;">
      <div class="filters-row">
        <div class="input-box"><input type="text" id="globalSearchInput" placeholder="🔍 Search Order or Mobile..."></div>
        <div class="filter-box"><input type="date" id="dateFilterInput" title="Select Date"></div>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost" id="resetFiltersBtn">🧹 Reset Filters</button>
        <button class="btn btn-ghost" id="fetchDataBtn">🔄 Refresh Data</button>
      </div>
    </div>

    <div id="todaySearchBox" style="display: none; margin-bottom: 20px;">
       <input type="text" id="todaySearchInput" placeholder="🔍 Search Today's Orders...">
    </div>

    <div id="cardsContainer" class="order-cards-container"></div>
  </div>

  <!-- Modals -->
  <div class="modal-backdrop" id="userModalBackdrop">
     <div class="modal-box" style="max-width: 550px;">
        <div class="modal-header">
           <h3 style="margin:0; font-size:18px; font-weight:800; color:var(--text-main);">👥 Smart User Management</h3>
           <button class="modal-close" onclick="document.getElementById('userModalBackdrop').style.display='none'">&times;</button>
        </div>
        <div class="modal-content-scroll">
           <div style="background: var(--item-bg); padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border);">
               <h4 style="margin-top:0; margin-bottom: 12px; font-size:14px; color:var(--text-main);">➕ Add New / ✏️ Update Password</h4>
               <div style="display:flex; gap:10px; flex-wrap:wrap;">
                   <input type="text" id="targetUserid" placeholder="Staff ID" style="flex:1;">
                   <input type="password" id="newPassword" placeholder="New Password" style="flex:1;">
                   <button class="btn btn-primary" id="saveUserBtn" style="width:auto;">Save</button>
               </div>
               <div id="userActionStatus" style="display: none;"></div>
           </div>
           <table class="history-table">
             <thead><tr><th>User ID</th><th>Role</th><th>Action</th></tr></thead>
             <tbody id="usersTableBody"><tr><td colspan="3" style="text-align:center;">Loading users...</td></tr></tbody>
           </table>
        </div>
     </div>
  </div>

  <div class="modal-backdrop" id="historyModalBackdrop">
    <div class="modal-box">
       <div class="modal-header">
          <h3 style="margin:0; font-size:18px; font-weight:800; color:var(--text-main);">📜 Purchase History</h3>
          <button class="modal-close" onclick="document.getElementById('historyModalBackdrop').style.display='none'">&times;</button>
       </div>
       <div class="modal-content-scroll">
         <p id="historyCustomerDetails" style="font-size: 13px; font-weight: 600; margin-top:0; color: var(--primary);"></p>
         <table class="history-table">
           <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Status</th></tr></thead>
           <tbody id="historyTableBody"></tbody>
         </table>
       </div>
    </div>
 </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwgSqRCK9BDyxXPdac6clcXzSS1kY0tlA0AIK_C1io030Mxi0BpUoMjMO31Bhq_BcKa/exec";
    
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pharmaTheme', next);
      themeBtn.innerText = next === 'dark' ? '☀️' : '🌙';
    });

    document.getElementById('welcomeUser').innerText = currentAdminUser;
    const isAdmin = (currentUserRole === 'Admin' || currentUserRole === 'admin');
    if(!isAdmin) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');

    let currentTab = 'history'; 
    let currentStatusQuickFilter = ''; 

    document.getElementById('profileToggleBtn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('profileDropdownMenu').style.display = 'block'; });
    document.addEventListener('click', () => { document.getElementById('profileDropdownMenu').style.display = 'none'; });
    document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.clear(); window.location.href = 'login.html'; });

    // --- Users Code ---
    document.getElementById('openUserModalBtn').addEventListener('click', () => { document.getElementById('userModalBackdrop').style.display = 'flex'; fetchUsersList(); });
    function fetchUsersList() {
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">🔄 Fetching staff...</td></tr>';
        
        fetch(WEB_APP_URL, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: 'fetchUsers', token: myToken }) })
        .then(res => res.json()).then(data => {
            if(data.status === 'success') {
                tbody.innerHTML = '';
                data.data.forEach(u => {
                    const isMainAdmin = u.userid.toLowerCase() === 'admin';
                    const deleteBtn = isMainAdmin ? '<span style="color:var(--text-muted); font-size:12px; font-weight:700;">🔒 Master</span>' : `<button class="btn-action" style="background:rgba(239, 68, 68, 0.15); color:#ef4444; border:1px solid #ef4444;" onclick="deleteStaff('${u.userid}')">🗑️ Delete</button>`;
                    tbody.innerHTML += `<tr><td style="font-weight:700; color:var(--text-main);">${u.userid}</td><td><span class="badge badge-normal" style="font-size:11px;">${u.role}</span></td><td>${deleteBtn}</td></tr>`;
                });
            } else { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ef4444;">Failed to load users.</td></tr>'; }
        });
    }
    document.getElementById('saveUserBtn').addEventListener('click', () => {
       const targetId = document.getElementById('targetUserid').value.trim(); const newPass = document.getElementById('newPassword').value.trim();
       if(!targetId || !newPass) return;
       const btn = document.getElementById('saveUserBtn'); btn.innerText = "⏳..."; btn.disabled = true;
       const statusDiv = document.getElementById('userActionStatus');
       
       fetch(WEB_APP_URL, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: 'manageUser', token: myToken, targetUserid: targetId, newPassword: newPass }) })
       .then(res => res.json()).then(data => {
          statusDiv.style.display = "block"; statusDiv.className = data.status === 'success' ? 'msg-success' : 'msg-error';
          statusDiv.innerText = data.message; document.getElementById('targetUserid').value = ''; document.getElementById('newPassword').value = '';
          fetchUsersList(); setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
       }).finally(() => { btn.innerText = "Save"; btn.disabled = false; });
    });
    window.deleteStaff = function(userid) {
        if(!confirm(`Delete staff ID: "${userid}"?`)) return;
        fetch(WEB_APP_URL, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: 'deleteUser', token: myToken, targetUserid: userid }) })
        .then(res => res.json()).then(data => { if(data.status === 'success') { fetchUsersList(); } else alert(data.message); });
    }

    const cardsContainer = document.getElementById('cardsContainer');
    let allOrders = [];

    // --- સુપર-ફાસ્ટ ઓટો-રિફ્રેશ (કેશ બાયપાસ સાથે) ---
    function fetchLiveOrders(isAutoRefresh = false) {
      const syncStatus = document.getElementById('autoRefreshStatus');
      if (!isAutoRefresh) {
          cardsContainer.innerHTML = `<div style="text-align:center; padding: 40px; font-size:18px; font-weight:bold;">🔄 ગૂગલ શીટ માંથી ડેટા આવી રહ્યો છે... રાહ જુઓ...</div>`; 
      } else {
          syncStatus.innerText = "(Syncing 🔄...)";
          syncStatus.style.color = "#f59e0b"; // પીળો કલર
      }

      // બ્રાઉઝર કેશ તોડવા માટે URL માં ટાઈમસ્ટેમ્પ
      const noCacheUrl = WEB_APP_URL + "?t=" + new Date().getTime();

      fetch(noCacheUrl, { 
          method: 'POST', 
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'fetchOrders', token: myToken }) 
      })
      .then(res => res.text()) 
      .then(rawText => {
        syncStatus.innerText = "(Live 🟢)";
        syncStatus.style.color = "var(--primary)";
        
        let data;
        try { data = JSON.parse(rawText); } 
        catch(e) { cardsContainer.innerHTML = `<div style="color:#991b1b; padding:20px;"><b>❌ Error:</b> ${rawText.substring(0, 200)}</div>`; return; }

        if(data.status === 'unauthorized') { 
            alert("Security Session Expired. Please login again.");
            sessionStorage.clear(); window.location.href = 'login.html'; return; 
        }

        if(data.status === 'success') {
            if(!data.data || data.data.length === 0) {
                 cardsContainer.innerHTML = `<div style="text-align:center; padding: 30px; font-size:16px; color:#92400e;">📭 ગૂગલ શીટ ખાલી છે! કોઈ ઓર્ડર નથી.</div>`;
                 document.getElementById('totalOrdersCount').innerText = 0; document.getElementById('pendingOrdersCount').innerText = 0; document.getElementById('skywayOrdersCount').innerText = 0;
            } else {
                 allOrders = data.data; allOrders.reverse(); applyFilters();
            }
        }
      }).catch(err => { 
          syncStatus.innerText = "(Sync Failed ❌)";
          syncStatus.style.color = "#ef4444";
      });
    }

    function applyFilters() {
      const now = new Date();
      const tY = now.getFullYear(); const tM = now.getMonth(); const tD = now.getDate();

      const todaySearchQuery = document.getElementById('todaySearchInput') ? document.getElementById('todaySearchInput').value.toLowerCase().trim() : '';
      const historyGlobalQuery = document.getElementById('globalSearchInput') ? document.getElementById('globalSearchInput').value.toLowerCase().trim() : '';
      const dateQuery = document.getElementById('dateFilterInput') ? document.getElementById('dateFilterInput').value : '';

      let tabFiltered = allOrders.filter(o => {
        let isToday = false; let isDateQueryMatch = false;

        if (o.timestamp) { 
            try { 
                let d = new Date(o.timestamp); 
                if (!isNaN(d.getTime())) { 
                    isToday = (d.getDate() === tD && d.getMonth() === tM && d.getFullYear() === tY);
                    if (dateQuery) {
                        let parts = dateQuery.split('-'); 
                        if(parts.length === 3) { isDateQueryMatch = (d.getFullYear() === parseInt(parts[0]) && d.getMonth() === (parseInt(parts[1]) - 1) && d.getDate() === parseInt(parts[2])); }
                    }
                } 
            } catch(e) {} 
        }

        if (currentTab === 'today') {
           if (!isToday) return false; 
           if (todaySearchQuery) { const combined = Object.values(o).join(' ').toLowerCase(); if (!combined.includes(todaySearchQuery)) return false; }
        } else if (currentTab === 'history') {
           if (dateQuery && !isDateQueryMatch) return false;
           if (historyGlobalQuery) { const combined = Object.values(o).join(' ').toLowerCase(); if (!combined.includes(historyGlobalQuery)) return false; }
        }
        return true;
      });

      const groupedForStats = {};
      tabFiltered.forEach(o => { if(!groupedForStats[o.orderId]) groupedForStats[o.orderId] = []; groupedForStats[o.orderId].push(o); });
      let pCount = 0, sCount = 0;
      for (const items of Object.values(groupedForStats)) {
         const st = (items[0].orderStatus || 'Pending').toLowerCase().trim();
         if(st === 'pending') pCount++;
         if(st === 'skyway') sCount++;
      }
      document.getElementById('totalOrdersCount').innerText = Object.keys(groupedForStats).length;
      document.getElementById('pendingOrdersCount').innerText = pCount;
      document.getElementById('skywayOrdersCount').innerText = sCount;

      let finalFiltered = tabFiltered.filter(o => {
        const rowStatus = (o.orderStatus || 'Pending').toLowerCase().trim();
        if (currentStatusQuickFilter && rowStatus !== currentStatusQuickFilter) return false;
        return true;
      });
      renderCards(finalFiltered);
    }

    function getStatusColors(status) {
      const s = (status || 'Pending').toLowerCase().trim();
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if(s === 'skyway') return { bg: isDark ? 'rgba(16, 185, 129, 0.15)' : '#d1fae5', text: isDark ? '#34d399' : '#065f46', border: isDark ? '#059669' : '#10b981' }; 
      if(s === 'not available') return { bg: isDark ? 'rgba(239, 68, 68, 0.15)' : '#fee2e2', text: isDark ? '#f87171' : '#991b1b', border: isDark ? '#dc2626' : '#ef4444' }; 
      return { bg: isDark ? 'rgba(245, 158, 11, 0.15)' : '#fef3c7', text: isDark ? '#fbbf24' : '#92400e', border: isDark ? '#d97706' : '#f59e0b' }; 
    }

    function renderCards(ordersList) {
      cardsContainer.innerHTML = '';
      if(ordersList.length === 0) { cardsContainer.innerHTML = '<div style="color:var(--text-muted);">📭 No orders found.</div>'; return; }
      const groupedOrders = {};
      ordersList.forEach(order => { if (!groupedOrders[order.orderId]) groupedOrders[order.orderId] = []; groupedOrders[order.orderId].push(order); });

      for (const [orderId, items] of Object.entries(groupedOrders)) {
         const firstItem = items[0];
         let currentStatusRaw = (firstItem.orderStatus || 'Pending').trim().toLowerCase();
         let currentStatus = 'Pending';
         if (currentStatusRaw === 'skyway') currentStatus = 'Skyway';
         if (currentStatusRaw === 'not available') currentStatus = 'Not available';
         
         const colors = getStatusColors(currentStatus);
         const fileBadge = firstItem.fileUrl ? `<a href="${firstItem.fileUrl}" target="_blank" style="background:var(--btn-action-bg); color:var(--primary); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; border: 1px solid var(--border);">📎 View File</a>` : '';
         const processedBadge = (firstItem.processedBy && currentStatus !== 'Pending' && isAdmin) ? `<div class="processed-badge">🧑‍💻 Processed by: ${firstItem.processedBy}</div>` : '';
         const historyBtn = `<button class="btn-action" onclick="showCustomerHistory('${firstItem.mobile}', '${firstItem.customer.replace(/'/g, "\\'")}')">📜 History</button>`;

         const itemsHtml = items.map((item, index) => `<div class="item-row"><span class="item-name">${index + 1}. ${item.product}</span><span class="item-qty">Qty: ${item.qty}</span></div>`).join('');

         cardsContainer.innerHTML += `
            <div class="order-card" style="border: 2px solid ${colors.border};">
               <div class="order-header"><div style="flex:1;"><div class="order-id">${orderId}</div><div class="order-time">${new Date(firstItem.timestamp).toLocaleString('en-IN', {dateStyle: 'short', timeStyle: 'short'})}</div>${processedBadge}</div><span class="${firstItem.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal'}">${firstItem.priority || 'Normal'}</span></div>
               <div><div class="customer-info">${firstItem.customer} ${historyBtn}</div><div class="customer-mobile">📱 ${firstItem.mobile}</div></div>
               ${fileBadge ? `<div style="margin-top:-5px;">${fileBadge}</div>` : ''}
               <div class="items-box">${itemsHtml}</div>
               <div class="order-footer">
                  <select class="status-dropdown" data-id="${orderId}" style="background:${colors.bg}; color:${colors.text}; border: 1px solid ${colors.border};">
                     <option value="Pending" style="background:var(--surface); color:var(--text-main)" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                     <option value="Skyway" style="background:var(--surface); color:var(--text-main)" ${currentStatus === 'Skyway' ? 'selected' : ''}>Skyway</option>
                     <option value="Not available" style="background:var(--surface); color:var(--text-main)" ${currentStatus === 'Not available' ? 'selected' : ''}>Not available</option>
                  </select>
               </div>
            </div>`;
      }
    }

    cardsContainer.addEventListener('change', (e) => {
      if(e.target.classList.contains('status-dropdown')) {
        const orderId = e.target.getAttribute('data-id'); const newStatus = e.target.value;
        const noCacheUrl = WEB_APP_URL + "?t=" + new Date().getTime();
        fetch(noCacheUrl, { method: 'POST', headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: newStatus, token: myToken, username: currentAdminUser }) })
        .then(() => fetchLiveOrders(true)); 
      }
    });

    window.showCustomerHistory = function(mobile, name) {
       document.getElementById('historyCustomerDetails').innerText = `Customer: ${name} (${mobile})`;
       const tbody = document.getElementById('historyTableBody'); tbody.innerHTML = '';
       const cleanMobile = String(mobile).replace(/\D/g, '').slice(-10);
       const customerOrders = allOrders.filter(o => { if(!o.mobile) return false; return String(o.mobile).replace(/\D/g, '').slice(-10) === cleanMobile; });
       if(customerOrders.length === 0) { tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No past orders found.</td></tr>`; } 
       else {
          customerOrders.forEach(o => {
             const dateStr = o.timestamp ? new Date(o.timestamp).toLocaleDateString('en-IN') : 'N/A';
             let statusColor = o.orderStatus === 'Skyway' ? '#10b981' : (o.orderStatus === 'Not available' ? '#ef4444' : '#f59e0b');
             tbody.innerHTML += `<tr><td>${dateStr}</td><td style="font-weight:600;">${o.product}</td><td>${o.qty}</td><td style="color:${statusColor}; font-weight:700;">${o.orderStatus || 'Pending'}</td></tr>`;
          });
       }
       document.getElementById('historyModalBackdrop').style.display = 'flex';
    };

    document.getElementById('tabToday').addEventListener('click', () => { currentTab = 'today'; document.getElementById('tabToday').classList.add('active'); document.getElementById('tabHistory').classList.remove('active'); document.getElementById('controlsPanel').style.display = 'none'; document.getElementById('todaySearchBox').style.display = 'block'; applyFilters(); });
    document.getElementById('tabHistory').addEventListener('click', () => { currentTab = 'history'; document.getElementById('tabHistory').classList.add('active'); document.getElementById('tabToday').classList.remove('active'); document.getElementById('controlsPanel').style.display = 'block'; document.getElementById('todaySearchBox').style.display = 'none'; applyFilters(); });
    document.getElementById('quickAllBtn').addEventListener('click', () => { currentStatusQuickFilter = ''; document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active-all','active-pending','active-notavail')); document.getElementById('quickAllBtn').classList.add('active-all'); applyFilters(); });
    document.getElementById('quickPendingBtn').addEventListener('click', () => { currentStatusQuickFilter = 'pending'; document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active-all','active-pending','active-notavail')); document.getElementById('quickPendingBtn').classList.add('active-pending'); applyFilters(); });
    document.getElementById('quickNotAvailBtn').addEventListener('click', () => { currentStatusQuickFilter = 'not available'; document.querySelectorAll('.quick-btn').forEach(b=>b.classList.remove('active-all','active-pending','active-notavail')); document.getElementById('quickNotAvailBtn').classList.add('active-notavail'); applyFilters(); });

    if(document.getElementById('todaySearchInput')) document.getElementById('todaySearchInput').addEventListener('input', applyFilters);
    if(document.getElementById('globalSearchInput')) document.getElementById('globalSearchInput').addEventListener('input', applyFilters);
    if(document.getElementById('dateFilterInput')) document.getElementById('dateFilterInput').addEventListener('change', applyFilters);
    if(document.getElementById('resetFiltersBtn')) document.getElementById('resetFiltersBtn').addEventListener('click', () => { document.getElementById('globalSearchInput').value = ''; document.getElementById('dateFilterInput').value = ''; applyFilters(); });
    if(document.getElementById('fetchDataBtn')) document.getElementById('fetchDataBtn').addEventListener('click', () => fetchLiveOrders(false));

    // દર 20 સેકન્ડે ઓટો-રિફ્રેશ થશે
    document.addEventListener('DOMContentLoaded', () => { 
        fetchLiveOrders(false); 
        setInterval(() => fetchLiveOrders(true), 20000); 
    });
  </script>
</body>
</html>
