<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pharma Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f4f8f7; --surface: #ffffff; --primary: #0f766e; --text: #1f2937; --border: #d9e2df; }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(15, 118, 110, 0.08); }
    h1 { color: var(--primary); font-size: 26px; font-weight: 800; margin: 0 0 15px; }
    .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f2f7f5; padding: 12px; border-bottom: 2px solid var(--border); text-align: left; }
    td { padding: 12px; border-bottom: 1px solid var(--border); }
    .order-group-border { border-top: 3px solid var(--primary); }
    .status-dropdown { padding: 6px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; }
    input, select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Dashboard</h1>
    <div class="controls">
      <input type="text" id="search" placeholder="Search...">
      <select id="priorityFilter"><option value="">All Priorities</option><option value="Normal">Normal</option><option value="Urgent">Urgent</option></select>
      <select id="statusFilter"><option value="">All Statuses</option><option value="Pending">Pending</option><option value="Skyway">Skyway</option></select>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>Time</th><th>Order ID</th><th>Customer</th><th>Product</th><th>Qty</th><th>Priority</th><th>Status</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script>
    const WEB_APP_URL = "PASTE_YOUR_LINK_HERE";
    let allOrders = [];
    async function fetchData() {
      const res = await fetch(WEB_APP_URL);
      allOrders = await res.json();
      renderTable();
    }
    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      let lastOrderId = '';
      allOrders.forEach(o => {
        const isNewGroup = lastOrderId !== o.orderId;
        const row = document.createElement('tr');
        if(isNewGroup) row.classList.add('order-group-border');
        row.innerHTML = `<td>${o.timestamp || ''}</td><td>${o.orderId}</td><td>${o.customer}</td><td>${o.product}</td><td>${o.qty}</td><td>${o.priority}</td><td>${o.orderStatus}</td>`;
        tbody.appendChild(row);
        lastOrderId = o.orderId;
      });
    }
    fetchData();
  </script>
</body>
</html>
