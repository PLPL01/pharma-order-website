<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - ERP protected Pharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    const myToken = sessionStorage.getItem('pharmaAdminToken');
    const currentAdminUser = sessionStorage.getItem('pharmaCurrentUsername') || 'User';
    const currentUserRole = sessionStorage.getItem('pharmaUserRole') || 'Staff'; 
    if (!myToken) { window.location.href = 'login.html'; }
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
    }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 30px; color: var(--text-main); }
    .card { max-width: 1400px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); }
    
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; position: relative; }
    h1 { margin: 0 0 4px; color: var(--text-main); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0; font-size: 14px; }
    
    .profile-container { position: relative; display: inline-block; z-index: 100; }
    .profile-btn { background: #fff; border: 1px solid var(--border); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: all 0.2s; }
    .profile-btn:hover { background: #f8fafc; border-color: var(--primary); }
    .profile-btn .avatar { background: #ccfbf1; color: var(--primary); padding: 4px 8px; border-radius: 8px; font-size: 14px; }
    .profile-dropdown { display: none; position: absolute; right: 0; top: 52px; background: #fff; border: 1px solid var(--border); border-radius: 12px; width: 220px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000; padding: 6px; }
    .dropdown-item { width: 100%; padding: 10px 14px; border: none; background: none; text-align: left; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-main); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-sizing: border-box; }
    .dropdown-item:hover { background: #f1f5f9; color: var(--primary); }
    .dropdown-item.logout-item { color: #991b1b; }
    .dropdown-item.logout-item:hover { background: #fee2e2; }
    
    .tabs-container { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .tabs-container::-webkit-scrollbar { display: none; }
    .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 15px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 10px; transition: all 0.2s; flex-shrink: 0; }
    .tab-btn:hover { background: #f1f5f9; color: var(--text-main); }
    .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2); }

    .quick-filters-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; background: #f8fafc; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); }
    .quick-btn { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); background: #fff; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; flex-grow: 1; justify-content: center; }
    .quick-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .quick-btn.active-all { background: #e2e8f0; color: #1e293b; border-color: #cbd5e1; }
    .quick-btn.active-pending { background: #fef3c7; color: #92400e; border-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.2); }
    .quick-btn.active-notavail { background: #fee2e2; color: #991b1b; border-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.2); }

    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; position: relative; }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 8px; }
    .refresh-indicator { position: absolute; top: 20px; right: 20px; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

    .controls-panel { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
    .filters-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .actions-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 16px; }
    .input-box { flex: 1; min-width: 200px; }
    .filter-box { min-width: 150px; }
    input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-main); background: #fff; outline: none; font-family: inherit; box-sizing: border-box; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    
    .btn { padding: 11px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-family: inherit; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: #fff; color: var(--text-main); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #f1f5f9; }
    .btn-action { background: #e2e8f0; color: #334155; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; margin-left: 8px; transition: 0.2s; }
    .btn-action:hover { background: #cbd5e1; }
    
    .order-cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 24px; }
    .order-card { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; border-top: 6px solid var(--primary); transition: transform 0.2s; box-sizing: border-box; }
    .order-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; gap: 10px;}
    .order-id { font-weight: 800; color: var(--primary); font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .order-time { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .processed-badge { font-size: 11px; font-weight: 700; color: #475569; background: #e2e8f0; padding: 4px 8px; border-radius: 6px; display: inline-block; margin-top: 8px; }
    .customer-info { font-weight: 700; color: var(--text-main); font-size: 16px; display:flex; align-items: center; }
    .customer-mobile { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-top: 4px; }
    
    .items-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
    .items-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 0.05em; }
    .items-list-scroll { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-name { font-weight: 600; color: #334155; flex: 1; padding-right: 10px; }
    .item-qty { font-weight: 800; color: var(--primary); background: #e2e8f0; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
    
    .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
    .badge { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .badge-normal { background: #f1f5f9; color: #475569; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    .status-dropdown { border: 2px solid transparent; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; outline: none; width: 150px; transition: all 0.2s; }
    .status-saving { opacity: 0.5; pointer-events: none; }
    .loading-status { text-align: center; padding: 50px 20px; color: var(--text-muted); font-weight: 600; font-size: 16px; grid-column: 1 / -1; }

    /* Modals CSS */
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); position: relative; box-sizing: border-box; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
    .modal-title { margin: 0; font-size: 18px; font-weight: 800; color: var(--text-main); }
    .modal-close { background: none; border: none; font-size: 20px; font-weight: 700; color: var(--text-muted); cursor: pointer; }
    .modal-content-scroll { overflow-y: auto; flex-grow: 1; padding-right: 5px; }

    /* Simple Table for History */
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .history-table th, .history-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
    .history-table th { background: #f8fafc; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .card { padding: 15px; border-radius: 12px; }
      .header-section { flex-direction: column; align-items: flex-start; gap: 15px; }
      .profile-container { width: 100%; display: flex; justify-content: flex-end; }
      .profile-dropdown { right: 0; top: 45px; width: 100%; max-width: 250px; }
      h1 { font-size: 22px; }
      .stats-container { grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
      .stat-card { padding: 16px; }
      .order-cards-container { gap: 16px; }
      .order-card { padding: 16px; }
      .filters-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .input-box, .filter-box { width: 100%; }
      .actions-row { flex-direction: column; width: 100%; }
      .actions-row .btn { width: 100%; justify-content: center; }
      .quick-filters-row { padding: 10px; gap: 8px; }
      .quick-btn { flex: 1 1 calc(50% - 10px); padding: 8px 10px; font-size: 12px; }
      .order-footer { flex-direction: column; align-items: stretch; }
      .status-dropdown { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-section">
      <div>
        <h1>🔒 Protected Admin Dashboard</h1>
        <p>Security Node Online</p>
      </div>
      
      <div class="profile-container">
        <button class="profile-btn" id="profileToggleBtn">
          <span class="avatar">👤</span>
          <span id="welcomeUser">User</span>
          <span style="font-size:10px; margin-left:2px;">▼</span>
        </button>
        <div class="profile-dropdown" id="profileDropdownMenu">
          <button class="dropdown-item admin-only" id="openUserModalBtn">🔑 Manage Staff</button>
          <hr class="admin-only" style="border:0; border-top:1px solid var(--border); margin:4px 0;">
          <button class="dropdown-item logout-item" id="logoutBtn">🚪 Logout Securely</button>
        </div>
      </div>
    </div>

    <!-- 🗂️ TABS -->
    <div class="tabs-container">
       <button class="tab-btn active" id="tabToday">📦 Today's Orders</button>
       <button class="tab-btn" id="tabHistory">📜 Order History</button>
    </div>

    <!-- ⚡ QUICK SHORTCUT FILTERS -->
    <div class="quick-filters-row">
       <span style="font-size:13px; font-weight:800; color:var(--text-muted); text-transform:uppercase; width: 100%; margin-bottom: 4px;">🔍 Quick Filter:</span>
       <button class="quick-btn active-all" id="quickAllBtn">📁 All Orders</button>
       <button class="quick-btn" id="quickPendingBtn">🟡 Pending</button>
       <button class="quick-btn" id="quickNotAvailBtn">🔴 Not Available</button>
    </div>

    <!-- 📊 STATS CARDS -->
    <div class="stats-container">
      <div class="stat-card">
        <div class="refresh-indicator" title="Live Auto-Refresh Active"></div>
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="totalOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" style="color:#d97706;" id="pendingOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Skyway (Clear)</span>
        <span class="stat-value" style="color:#059669;" id="skywayOrdersCount">0</span>
      </div>
    </div>

    <!-- Filters Panel -->
    <div class="controls-panel" id="controlsPanel" style="display: none;">
      <div class="filters-row">
        <div class="input-box">
          <input type="text" id="globalSearchInput" placeholder="🔍 Search Order or Mobile...">
        </div>
        <div class="filter-box"><input type="date" id="dateFilterInput" title="Select Date"></div>
        <div class="filter-box">
          <select id="priorityFilter">
            <option value="">All Priorities</option>
            <option value="Normal">Normal</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="actions-row">
        <button class="btn btn-ghost" id="resetFiltersBtn">🧹 Reset Filters</button>
        <button class="btn btn-ghost" id="fetchDataBtn">🔄 Refresh Data</button>
        <!-- 📥 EXPORT EXCEL (Admin Only) -->
        <button class="btn btn-primary admin-only" id="exportExcelBtn" style="width: auto; margin-top: 0;">📥 Export to Excel</button>
      </div>
    </div>

    <!-- Search box specifically for Today's Tab -->
    <div id="todaySearchBox" style="margin-bottom: 20px;">
       <input type="text" id="todaySearchInput" placeholder="🔍 Search Today's Orders...">
    </div>

    <div id="cardsContainer" class="order-cards-container">
       <div class="loading-status">🔄 Fetching Secure Data...</div>
    </div>
  </div>

  <!-- Modal 1: User & Password Manager (Admin Only) -->
  <div class="modal-backdrop" id="userModalBackdrop">
     <div class="modal-box">
        <div class="modal-header">
           <h3 class="modal-title">👥 Manage Staff</h3>
           <button class="modal-close" onclick="document.getElementById('userModalBackdrop').style.display='none'">&times;</button>
        </div>
        <div style="display:flex; flex-direction:column; gap:14px;">
           <input type="text" id="targetUserid" placeholder="User ID">
           <input type="password" id="newPassword" placeholder="New Password">
           <button class="btn btn-primary" id="saveUserBtn">💾 Save Changes</button>
           <div id="userActionStatus" style="font-size: 13px; font-weight: 700; display: none; text-align:center; padding: 8px; border-radius: 8px;"></div>
        </div>
     </div>
  </div>

  <!-- Modal 2: Customer History -->
  <div class="modal-backdrop" id="historyModalBackdrop">
    <div class="modal-box">
       <div class="modal-header">
          <h3 class="modal-title">📜 Purchase History</h3>
          <button class="modal-close" onclick="document.getElementById('historyModalBackdrop').style.display='none'">&times;</button>
       </div>
       <div class="modal-content-scroll">
         <p id="historyCustomerDetails" style="font-size: 13px; font-weight: 600; margin-top:0; color: var(--primary);"></p>
         <table class="history-table">
           <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Status</th></tr></thead>
           <tbody id="historyTableBody"></tbody>
         </table>
       </div>
    </div>
 </div>

 <!-- Modal 3: Audit Log (Admin Only) -->
 <div class="modal-backdrop" id="auditModalBackdrop">
  <div class="modal-box">
     <div class="modal-header">
        <h3 class="modal-title">🕵️‍♂️ Security Audit Log</h3>
        <button class="modal-close" onclick="document.getElementById('auditModalBackdrop').style.display='none'">&times;</button>
     </div>
     <div class="modal-content-scroll">
       <p id="auditOrderDetails" style="font-size: 14px; font-weight: 800; margin-top:0; color: var(--primary);"></p>
       <pre id="auditLogText" style="font-size: 12px; background: #f1f5f9; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-family: inherit; color: var(--text-main); line-height: 1.6;"></pre>
     </div>
  </div>
</div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwQ24DbTK65mGs8Xzm3k5hZIzlvGjCwaeWVHGVyApQUBuWA3QNSVDjkOukDYy4KXsEf/exec";
    
    document.getElementById('welcomeUser').innerText = currentAdminUser;
    const isAdmin = (currentUserRole === 'Admin' || currentUserRole === 'admin');
    if(!isAdmin) { document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none'); }

    let currentTab = 'today'; 
    let currentStatusQuickFilter = ''; 

    document.getElementById('profileToggleBtn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('profileDropdownMenu').style.display = 'block'; });
    document.addEventListener('click', () => { document.getElementById('profileDropdownMenu').style.display = 'none'; });

    document.getElementById('openUserModalBtn').addEventListener('click', () => { document.getElementById('userModalBackdrop').style.display = 'flex'; });

    document.getElementById('logoutBtn').addEventListener('click', () => {
       sessionStorage.clear(); window.location.href = 'login.html';
    });

    document.getElementById('saveUserBtn').addEventListener('click', () => {
       const targetId = document.getElementById('targetUserid').value.trim();
       const newPass = document.getElementById('newPassword').value.trim();
       const statusDiv = document.getElementById('userActionStatus');
       fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'manageUser', token: myToken, targetUserid: targetId, newPassword: newPass }) })
       .then(res => res.json()).then(data => {
          statusDiv.style.display = "block"; statusDiv.innerText = data.message;
          setTimeout(() => { document.getElementById('userModalBackdrop').style.display = 'none'; }, 1500);
       });
    });

    const cardsContainer = document.getElementById('cardsContainer');
    let allOrders = [];

    function fetchLiveOrders() {
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'fetchOrders', token: myToken }) })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'unauthorized') { document.getElementById('logoutBtn').click(); return; }
        allOrders = data.data; allOrders.reverse();
        applyFilters();
      });
    }

    function applyFilters() {
      const now = new Date();
      const todayIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      const todaySearchQuery = document.getElementById('todaySearchInput') ? document.getElementById('todaySearchInput').value.toLowerCase().trim() : '';
      const historyGlobalQuery = document.getElementById('globalSearchInput') ? document.getElementById('globalSearchInput').value.toLowerCase().trim() : '';
      const dateQuery = document.getElementById('dateFilterInput') ? document.getElementById('dateFilterInput').value : '';

      let filtered = allOrders.filter(o => {
        let rowDateIso = '';
        if (o.timestamp) { try { let d = new Date(o.timestamp); if (!isNaN(d.getTime())) { rowDateIso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); } } catch(e) {} }
        const rowStatus = (o.orderStatus || 'Pending').toLowerCase();

        if (currentTab === 'today') {
           if (rowDateIso !== todayIso) return false; 
           if (todaySearchQuery) { const combined = Object.values(o).join(' ').toLowerCase(); if (!combined.includes(todaySearchQuery)) return false; }
        } else if (currentTab === 'history') {
           if (dateQuery && rowDateIso !== dateQuery) return false;
           if (historyGlobalQuery) { const combined = Object.values(o).join(' ').toLowerCase(); if (!combined.includes(historyGlobalQuery)) return false; }
        }
        if (currentStatusQuickFilter && rowStatus !== currentStatusQuickFilter) return false;
        return true;
      });
      renderCards(filtered);
    }

    function getStatusColors(status) {
      if(status === 'Skyway') return { bg: '#d1fae5', text: '#065f46', border: '#10b981' }; 
      if(status === 'Not available') return { bg: '#fee2e2', text: '#991b1b', border: '#ef4444' }; 
      return { bg: '#fef3c7', text: '#92400e', border: '#f59e0b' }; 
    }

    function renderCards(ordersList) {
      cardsContainer.innerHTML = '';
      if(ordersList.length === 0) {
        cardsContainer.innerHTML = '<div class="loading-status">📭 No matching orders found.</div>'; return;
      }
      const groupedOrders = {};
      ordersList.forEach(order => { if (!groupedOrders[order.orderId]) groupedOrders[order.orderId] = []; groupedOrders[order.orderId].push(order); });

      let pendingCount = 0; let skywayCount = 0;

      for (const [orderId, items] of Object.entries(groupedOrders)) {
         const firstItem = items[0];
         const currentStatus = firstItem.orderStatus || 'Pending';
         const colors = getStatusColors(currentStatus);
         
         const fileBadge = firstItem.fileUrl ? `<a href="${firstItem.fileUrl}" target="_blank" style="background:#e0f2fe; color:#0369a1; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; display:inline-block; border: 1px solid #bae6fd;">📎 View File</a>` : '';
         
         // 👇 FIX: Processed By ONLY FOR ADMIN
         const processedBadge = (firstItem.processedBy && currentStatus !== 'Pending' && isAdmin) ? `<div class="processed-badge">🧑‍💻 Processed by: ${firstItem.processedBy}</div>` : '';
         
         const historyBtn = `<button class="btn-action" onclick="showCustomerHistory('${firstItem.mobile}', '${firstItem.customer.replace(/'/g, "\\'")}')">📜 History</button>`;
         const auditBtn = isAdmin ? `<button class="btn-action" onclick="showAuditLog('${orderId}')">🕵️‍♂️ Log</button>` : '';

         if(currentStatus === 'Pending') pendingCount++;
         if(currentStatus === 'Skyway') skywayCount++;

         const itemsHtml = items.map((item, index) => `<div class="item-row"><span class="item-name">${index + 1}. ${item.product}</span><span class="item-qty">Qty: ${item.qty}</span></div>`).join('');

         cardsContainer.innerHTML += `
            <div class="order-card" style="border: 2px solid ${colors.border}; box-shadow: 0 4px 12px ${colors.bg};">
               <div class="order-header">
                  <div style="flex:1;">
                     <div class="order-id">${orderId}</div>
                     <div class="order-time">${new Date(firstItem.timestamp).toLocaleString('en-IN', {dateStyle: 'short', timeStyle: 'short'})}</div>
                     ${processedBadge}
                  </div>
                  <span class="${firstItem.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal'}">${firstItem.priority || 'Normal'}</span>
               </div>
               <div>
                  <div class="customer-info">${firstItem.customer} ${historyBtn}</div>
                  <div class="customer-mobile">📱 ${firstItem.mobile}</div>
               </div>
               ${fileBadge ? `<div style="margin-top:-5px;">${fileBadge}</div>` : ''}
               <div class="items-box"><div class="items-list-scroll">${itemsHtml}</div></div>
               <div class="order-footer">
                  <select class="status-dropdown" data-id="${orderId}" style="background:${colors.bg}; color:${colors.text}; border: 1px solid ${colors.border};">
                     <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                     <option value="Skyway" ${currentStatus === 'Skyway' ? 'selected' : ''}>Skyway</option>
                     <option value="Not available" ${currentStatus === 'Not available' ? 'selected' : ''}>Not available</option>
                  </select>
                  ${auditBtn}
               </div>
            </div>`;
      }
      document.getElementById('totalOrdersCount').innerText = Object.keys(groupedOrders).length;
      document.getElementById('pendingOrdersCount').innerText = pendingCount;
      document.getElementById('skywayOrdersCount').innerText = skywayCount;
    }

    cardsContainer.addEventListener('change', (e) => {
      if(e.target.classList.contains('status-dropdown')) {
        const orderId = e.target.getAttribute('data-id'); const newStatus = e.target.value;
        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', orderId: orderId, status: newStatus, token: myToken, username: currentAdminUser }) })
        .then(() => fetchLiveOrders());
      }
    });

    // 👇 FIX: History Search by Robust Mobile Number Matching
    window.showCustomerHistory = function(mobile, name) {
       document.getElementById('historyCustomerDetails').innerText = `Customer: ${name} (${mobile})`;
       const tbody = document.getElementById('historyTableBody');
       tbody.innerHTML = '';
       
       const cleanMobile = String(mobile).replace(/\D/g, '').slice(-10);
       
       const customerOrders = allOrders.filter(o => {
          if(!o.mobile) return false;
          const oMobile = String(o.mobile).replace(/\D/g, '').slice(-10);
          return oMobile === cleanMobile;
       });

       if(customerOrders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No past orders found.</td></tr>`;
       } else {
          customerOrders.forEach(o => {
             const dateStr = o.timestamp ? new Date(o.timestamp).toLocaleDateString('en-IN') : 'N/A';
             let statusColor = o.orderStatus === 'Skyway' ? '#059669' : (o.orderStatus === 'Not available' ? '#e11d48' : '#d97706');
             tbody.innerHTML += `<tr><td>${dateStr}</td><td style="font-weight:600;">${o.product}</td><td>${o.qty}</td><td style="color:${statusColor}; font-weight:700;">${o.orderStatus || 'Pending'}</td></tr>`;
          });
       }
       document.getElementById('historyModalBackdrop').style.display = 'flex';
    };

    window.showAuditLog = function(orderId) {
       if(!isAdmin) return;
       const order = allOrders.find(o => o.orderId === orderId);
       document.getElementById('auditOrderDetails').innerText = `Audit Trail for: ${orderId}`;
       document.getElementById('auditLogText').innerText = (order && order.auditLog) ? order.auditLog : 'No logs available for this order.';
       document.getElementById('auditModalBackdrop').style.display = 'flex';
    };

    if(isAdmin) {
       document.getElementById('exportExcelBtn').addEventListener('click', () => {
          let csvContent = "data:text/csv;charset=utf-8,Date,Order ID,Customer Name,Mobile,Product,Qty,Priority,Status,Processed By\n";
          allOrders.forEach(o => {
             let d = o.timestamp ? new Date(o.timestamp).toLocaleString('en-IN') : '';
             let row = `"${d}","${o.orderId}","${o.customer}","${o.mobile}","${o.product}","${o.qty}","${o.priority}","${o.orderStatus}","${o.processedBy}"`;
             csvContent += row + "\n";
          });
          var encodedUri = encodeURI(csvContent);
          var link = document.createElement("a"); link.setAttribute("href", encodedUri); link.setAttribute("download", `Pharma_Orders_${new Date().toLocaleDateString('en-IN')}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
       });
    }

    document.getElementById('tabToday').addEventListener('click', () => { currentTab = 'today'; document.getElementById('tabToday').classList.add('active'); document.getElementById('tabHistory').classList.remove('active'); document.getElementById('controlsPanel').style.display = 'none'; document.getElementById('todaySearchBox').style.display = 'block'; applyFilters(); });
    document.getElementById('tabHistory').addEventListener('click', () => { currentTab = 'history'; document.getElementById('tabHistory').classList.add('active'); document.getElementById('tabToday').classList.remove('active'); document.getElementById('controlsPanel').style.display = 'block'; document.getElementById('todaySearchBox').style.display = 'none'; applyFilters(); });
    
    document.getElementById('quickAllBtn').addEventListener('click', () => { currentStatusQuickFilter = ''; applyFilters(); });
    document.getElementById('quickPendingBtn').addEventListener('click', () => { currentStatusQuickFilter = 'pending'; applyFilters(); });
    document.getElementById('quickNotAvailBtn').addEventListener('click', () => { currentStatusQuickFilter = 'not available'; applyFilters(); });

    if(document.getElementById('todaySearchInput')) document.getElementById('todaySearchInput').addEventListener('input', applyFilters);
    if(document.getElementById('globalSearchInput')) document.getElementById('globalSearchInput').addEventListener('input', applyFilters);
    if(document.getElementById('dateFilterInput')) document.getElementById('dateFilterInput').addEventListener('change', applyFilters);
    if(document.getElementById('resetFiltersBtn')) document.getElementById('resetFiltersBtn').addEventListener('click', () => { document.getElementById('globalSearchInput').value = ''; document.getElementById('dateFilterInput').value = ''; applyFilters(); });

    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
