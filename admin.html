<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pharma Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #f4f8f7;
      margin: 0;
      padding: 24px;
      color: #1f2937;
    }
    .card {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d9e2df;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 118, 110, 0.08);
    }
    h1 { margin: 0 0 6px; color: #0f766e; font-size: 28px; font-weight: 800; }
    p { color: #667085; margin: 0 0 20px 0; font-size: 15px; }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #f9fbfa;
      border: 1px solid #e5ede9;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .stat-label { font-size: 13px; color: #667085; font-weight: 600; text-transform: uppercase; }
    .stat-value { font-size: 24px; font-weight: 800; color: #0f766e; margin-top: 4px; }
    .stat-urgent { color: #b42318; }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    
    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d9e2df;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    
    .btn {
      background: #0f766e;
      color: #fff;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #115e59; }
    .btn-ghost { background: #fff; color: #1f2937; border: 1px solid #d9e2df; }
    .btn-ghost:hover { background: #f9fbfa; }
    
    .table-container {
      overflow-x: auto;
      border: 1px solid #d9e2df;
      border-radius: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid #d9e2df;
    }
    th {
      background: #f2f7f5;
      color: #374151;
      font-weight: 700;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fdfb; }
    
    .badge {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-normal { background: #f3f4f6; color: #374151; }
    .badge-urgent { background: #fee2e2; color: #991b1b; }
    
    .loading-status {
      text-align: center;
      padding: 30px;
      color: #667085;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div>
      <h1>Admin Dashboard</h1>
      <p>Customer na live orders nu tracking ane Excel export panel.</p>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-label">Total Orders</span>
        <span class="stat-value" id="totalOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Urgent Orders</span>
        <span class="stat-value stat-urgent" id="urgentOrdersCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Unique Customers</span>
        <span class="stat-value" id="uniqueCustomersCount">0</span>
      </div>
    </div>

    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="adminSearchInput" placeholder="🔍 Search by Customer Name, Order ID or Product...">
      </div>
      
      <div class="top-actions">
        <button class="btn btn-ghost" id="refreshBtn">🔄 Refresh Data</button>
        <button class="btn" id="exportCsvBtn">📥 Export Excel CSV</button>
        <a class="btn btn-ghost" href="index.html">Customer Page</a>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Mobile</th>
            <th>Product Name</th>
            <th>Qty in Strip</th>
            <th>Priority</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <tr>
            <td colspan="7" class="loading-status">Loading live orders from Google Sheet...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZtr1J677OBAE-KgxLUpQv310M7h8KWDW9_ap-RqQkKwtY5_4ek1i3f1TvD_iq-ZoP/exec";

    const tbody = document.getElementById('adminTableBody');
    const refreshBtn = document.getElementById('refreshBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const searchInput = document.getElementById('adminSearchInput');
    
    let allOrders = [];

    function fetchLiveOrders() {
      tbody.innerHTML = '<tr><td colspan="7" class="loading-status">🔄 Fetching fresh data from Google Sheet...</td></tr>';
      
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if(data.status === "error" || !Array.isArray(data)) {
            tbody.innerHTML = '<tr><td colspan="7" class="loading-status" style="color:#b42318;">No data found in Google Sheet. Make sure you submit an order first!</td></tr>';
            return;
          }
          
          allOrders = data;
          allOrders.reverse();
          
          updateDashboard(allOrders);
        })
        .catch(err => {
          tbody.innerHTML = '<tr><td colspan="7" class="loading-status" style="color:#b42318;">Error loading data. Google Apps Script connection failed.</td></tr>';
          console.error(err);
        });
    }

    function updateDashboard(ordersList) {
      if(ordersList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading-status">Koi matching orders nathi.</td></tr>';
        return;
      }

      tbody.innerHTML = ordersList.map(row => {
        const formattedDate = row.timestamp ? new Date(row.timestamp).toLocaleString('en-IN') : 'N/A';
        const priorityBadge = row.priority === 'Urgent' ? 'badge badge-urgent' : 'badge badge-normal';
        
        return `
          <tr>
            <td style="color: #667085;">${formattedDate}</td>
            <td style="font-weight: 700; color: #0f766e;">${row.orderId || 'N/A'}</td>
            <td style="font-weight: 600;">${row.customer || 'N/A'}</td>
            <td>${row.mobile || 'N/A'}</td>
            <td style="font-weight: 500;">${row.product || 'N/A'}</td>
            <td><strong>${row.qty || '0'}</strong></td>
            <td><span class="${priorityBadge}">${row.priority || 'Normal'}</span></td>
          </tr>
        `;
      }).join('');

      document.getElementById('totalOrdersCount').innerText = allOrders.length;
      document.getElementById('urgentOrdersCount').innerText = allOrders.filter(o => o.priority === 'Urgent').length;
      
      const uniqueCustomers = [...new Set(allOrders.map(o => o.customer.toLowerCase()))].length;
      document.getElementById('uniqueCustomersCount').innerText = uniqueCustomers;
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      if(!query) {
        updateDashboard(allOrders);
        return;
      }
      
      const filtered = allOrders.filter(o => 
        (o.customer && o.customer.toLowerCase().includes(query)) ||
        (o.orderId && o.orderId.toLowerCase().includes(query)) ||
        (o.product && o.product.toLowerCase().includes(query)) ||
        (o.mobile && o.mobile.includes(query))
      );
      
      updateDashboard(filtered);
    });

    exportCsvBtn.addEventListener('click', () => {
      if(!allOrders.length) return alert('Export karva mate koi data nathi.');
      
      const header = ['Date Time', 'Order ID', 'Customer Name', 'Mobile', 'Product Name', 'Qty', 'Priority'];
      const csvRows = [header.join(',')];
      
      allOrders.forEach(row => {
        const dateStr = row.timestamp ? new Date(row.timestamp).toLocaleString('en-IN') : 'N/A';
        const formattedRow = [
          `"${dateStr}"`,
          `"${row.orderId || ''}"`,
          `"${row.customer || ''}"`,
          `"${row.mobile || ''}"`,
          `"${row.product || ''}"`,
          `"${row.qty || '0'}"`,
          `"${row.priority || 'Normal'}"`
        ];
        csvRows.push(formattedRow.join(','));
      });
      
      const csvContent = csvRows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Pharma_All_Orders_' + new Date().toISOString().split('T')[0] + '.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    refreshBtn.addEventListener('click', fetchLiveOrders);

    document.addEventListener('DOMContentLoaded', fetchLiveOrders);
  </script>
</body>
</html>
