<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharma Order</title>
  <style>
    body{font-family:sans-serif; background:#f4f8f7; padding:20px;}
    .card{max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:15px;}
    input, select{width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:8px;}
    .btn{background:#0f766e; color:#fff; padding:10px; border:none; border-radius:8px; cursor:pointer; width:100%;}
  </style>
</head>
<body>
  <div class="card">
    <h2>Order Form</h2>
    <form id="orderForm">
      <input type="text" id="customerName" placeholder="Name" required>
      <input type="tel" id="mobile" placeholder="Mobile" required>
      <select id="priority"><option value="Normal">Normal</option><option value="Urgent">Urgent</option></select>
      <div id="products"></div>
      <button type="button" onclick="addProduct()">+ Add Product</button>
      <button type="submit" class="btn">Submit</button>
    </form>
  </div>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxWmU2xKySlRSHcCp-bs7xYFhoLdHOs08-nVxb9yuIz37UbVPOq9hSYHfS3uVEcTbo8/exec";
    function addProduct() {
      const div = document.createElement('div');
      div.innerHTML = `<input type="text" class="product-name" placeholder="Name"> <input type="number" class="product-qty" placeholder="Qty">`;
      document.getElementById('products').appendChild(div);
    }
    document.getElementById('orderForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const orderId = 'ORD-' + Math.floor(Math.random()*10000);
      const rows = Array.from(document.querySelectorAll('.product-name')).map((n, i) => ({
        orderId, customer: document.getElementById('customerName').value,
        mobile: document.getElementById('mobile').value,
        product: n.value, qty: document.querySelectorAll('.product-qty')[i].value,
        priority: document.getElementById('priority').value
      }));
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(rows), mode: 'no-cors' }).then(() => alert('Order Sent!'));
    });
    addProduct();
  </script>
</body>
</html>
