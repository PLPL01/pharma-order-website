<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Place Order - Secure Pharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; color: var(--text-main); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; box-sizing: border-box; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow-lg); width: 100%; max-width: 600px; box-sizing: border-box; }
    
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { margin: 0 0 8px; color: var(--primary); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); margin: 0; font-size: 15px; }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    input[type="text"], input[type="tel"], input[type="number"], select, input[type="file"] { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--text-main); background: #f8fafc; outline: none; font-family: inherit; box-sizing: border-box; transition: all 0.2s; }
    input:focus, select:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1); }
    input[type="file"] { padding: 10px; background: #fff; border: 1px dashed var(--primary); cursor: pointer; }
    
    .items-container { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .items-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .items-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
    
    .item-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .item-row input[type="text"] { flex: 2; }
    .item-row input[type="number"] { flex: 1; }
    
    .btn { padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: all 0.2s; box-sizing: border-box; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2); margin-top: 10px; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15, 118, 110, 0.3); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-ghost { background: #e2e8f0; color: var(--text-main); padding: 8px 16px; font-size: 13px; }
    .btn-ghost:hover { background: #cbd5e1; }
    
    .btn-remove { background: #fee2e2; color: #991b1b; padding: 14px; font-size: 16px; border-radius: 12px; cursor: pointer; border: none; transition: 0.2s; }
    .btn-remove:hover { background: #fca5a5; }

    .status-msg { margin-top: 20px; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 14px; text-align: center; display: none; }
    .msg-success { background: #d1fae5; color: #065f46; border: 1px solid #34d399; }
    .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }

    /* 📱 MOBILE RESPONSIVE CSS */
    @media (max-width: 600px) {
      body { padding: 15px; }
      .card { padding: 24px 20px; border-radius: 20px; }
      .header h1 { font-size: 24px; }
      .item-row { flex-direction: column; gap: 10px; align-items: stretch; background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; }
      .btn-remove { padding: 10px; font-size: 14px; margin-top: 5px; }
      input[type="text"], input[type="tel"], input[type="number"], select { padding: 12px 14px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>📦 Place New Order</h1>
      <p>Fill details carefully to generate an order.</p>
    </div>

    <form id="orderForm">
      <div class="input-group">
        <label>Customer Name *</label>
        <input type="text" id="customerName" placeholder="Enter full name" required>
      </div>
      
      <div class="input-group">
        <label>Mobile Number *</label>
        <input type="tel" id="mobileNumber" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="items-container">
        <div class="items-header">
          <h3>💊 Order Items</h3>
          <button type="button" class="btn btn-ghost" id="addItemBtn">+ Add Item</button>
        </div>
        <div id="itemsWrapper">
          <div class="item-row">
            <input type="text" class="productName" placeholder="Product / Medicine Name" required>
            <input type="number" class="productQty" placeholder="Qty" min="1" required>
            <button type="button" class="btn-remove" disabled style="opacity: 0.5;">✖</button>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>Priority Level</label>
        <select id="priorityLevel">
          <option value="Normal">🟢 Normal Delivery</option>
          <option value="Urgent">🔴 Urgent Delivery</option>
        </select>
      </div>

      <div class="input-group">
        <label>Upload Prescription (Optional)</label>
        <input type="file" id="prescriptionFile" accept="image/*, .pdf">
        <p style="font-size: 11px; color: var(--text-muted); margin-top: 6px;">Supported: JPG, PNG, PDF (Max 5MB)</p>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">🚀 Submit Order</button>
      <div id="statusMessage" class="status-msg"></div>
    </form>
  </div>

  <script>
    // 👇 તમારી નવી લિંક અહીં સેટ જ છે
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrnWtXr83C9uTVrGHvqgKlGaRPOqSdFMRlGizbprwQ1bWH2g5eLPu5pOUrfQJvI_03/exec";

    // Item Add/Remove Logic
    const itemsWrapper = document.getElementById('itemsWrapper');
    const addItemBtn = document.getElementById('addItemBtn');

    addItemBtn.addEventListener('click', () => {
      const newRow = document.createElement('div');
      newRow.className = 'item-row';
      newRow.innerHTML = `
        <input type="text" class="productName" placeholder="Product / Medicine Name" required>
        <input type="number" class="productQty" placeholder="Qty" min="1" required>
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✖</button>
      `;
      itemsWrapper.appendChild(newRow);
    });

    // Handle Form Submit
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      const customer = document.getElementById('customerName').value.trim();
      const mobile = document.getElementById('mobileNumber').value.trim();
      const priority = document.getElementById('priorityLevel').value;
      const fileInput = document.getElementById('prescriptionFile');

      // Gather Items
      const itemRows = document.querySelectorAll('.item-row');
      const items = [];
      const generateOrderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000); // Generate Unique ID

      itemRows.forEach(row => {
        const product = row.querySelector('.productName').value.trim();
        const qty = row.querySelector('.productQty').value.trim();
        if(product && qty) {
          items.push({ orderId: generateOrderId, customer, mobile, product, qty, priority });
        }
      });

      if(items.length === 0) {
        showStatus('error', '⚠️ Please add at least one item.');
        return;
      }

      submitBtn.innerText = "⏳ Processing Securely...";
      submitBtn.disabled = true;
      statusMsg.style.display = "none";

      try {
        let fileBase64 = "";
        let mimeType = "";
        let fileName = "";

        // If file selected, read as base64
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          
          if(file.size > 5 * 1024 * 1024) {
             showStatus('error', '⚠️ File size must be less than 5MB.');
             submitBtn.innerText = "🚀 Submit Order";
             submitBtn.disabled = false;
             return;
          }

          mimeType = file.type;
          fileName = customer.replace(/\s+/g, '_') + '_' + file.name;
          fileBase64 = await toBase64(file);
        }

        const payload = {
          action: 'newOrder',
          items: items,
          fileBase64: fileBase64,
          mimeType: mimeType,
          fileName: fileName
        };

        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          showStatus('success', `✅ Order placed successfully! ID: <b>${generateOrderId}</b>`);
          document.getElementById('orderForm').reset();
          // Keep only one item row
          itemsWrapper.innerHTML = `
            <div class="item-row">
              <input type="text" class="productName" placeholder="Product / Medicine Name" required>
              <input type="number" class="productQty" placeholder="Qty" min="1" required>
              <button type="button" class="btn-remove" disabled style="opacity: 0.5;">✖</button>
            </div>
          `;
        } else {
          showStatus('error', '❌ Failed to place order. ' + (result.message || ''));
        }

      } catch (error) {
        showStatus('error', '❌ Network Error. Please try again.');
      } finally {
        submitBtn.innerText = "🚀 Submit Order";
        submitBtn.disabled = false;
      }
    });

    // Helper: Convert File to Base64
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          let encoded = reader.result.toString().replace(/^data:(.*,)?/, '');
          if ((encoded.length % 4) > 0) { encoded += '='.repeat(4 - (encoded.length % 4)); }
          resolve(encoded);
        };
        reader.onerror = error => reject(error);
      });
    }

    function showStatus(type, msg) {
      const statusMsg = document.getElementById('statusMessage');
      statusMsg.style.display = "block";
      statusMsg.innerHTML = msg;
      statusMsg.className = type === 'success' ? 'status-msg msg-success' : 'status-msg msg-error';
    }
  </script>
</body>
</html>
