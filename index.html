<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Place Order - Secure Pharma</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0f766e; --bg: #f0fdfa; --border: #e2e8f0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; }
    .btn { padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    .item-row { display: flex; gap: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📦 Place Order</h1>
    <form id="orderForm">
      <input type="text" id="customerName" placeholder="Full Name" required>
      <input type="tel" id="mobileNumber" placeholder="Mobile Number" required>
      <div id="itemsWrapper">
        <div class="item-row">
          <input type="text" class="productName" placeholder="Medicine Name" required>
          <input type="number" class="productQty" placeholder="Qty" required>
        </div>
      </div>
      <button type="button" class="btn" style="background:#e2e8f0; color:#334155; margin-bottom:10px;" onclick="addItem()">+ Add Item</button>
      <input type="file" id="prescriptionFile" accept="image/*">
      <button type="submit" class="btn" id="submitBtn">🚀 Submit</button>
    </form>
  </div>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbznm1w4OTRlnrO1VwMv1vUHSlo2vrMgieVLowjte4lCR2_lwvSbHiigFBJy3OnjSes-/exec";
    function addItem() {
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `<input type="text" class="productName" placeholder="Medicine Name" required><input type="number" class="productQty" placeholder="Qty" required><button type="button" class="btn" style="width:auto;" onclick="this.parentElement.remove()">✖</button>`;
      document.getElementById('itemsWrapper').appendChild(div);
    }
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true; submitBtn.innerText = "Processing...";
      const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        items.push({ orderId, customer: document.getElementById('customerName').value, mobile: document.getElementById('mobileNumber').value, product: row.querySelector('.productName').value, qty: row.querySelector('.productQty').value, priority: 'Normal' });
      });
      const fileInput = document.getElementById('prescriptionFile');
      let fileBase64 = "", mimeType = "", fileName = "";
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        mimeType = file.type; fileName = Date.now() + "_" + file.name;
        fileBase64 = await new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result.split(',')[1]); reader.readAsDataURL(file); });
      }
      fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'newOrder', items, fileBase64, mimeType, fileName }) })
      .then(res => res.json()).then(r => { alert("Order Placed: " + orderId); location.reload(); });
    });
  </script>
</body>
</html>
