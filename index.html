<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Medicines - Secure Pharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Theme setup
    const savedTheme = localStorage.getItem('pharmaTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <style>
    :root {
      --bg: #f0fdfa; --surface: #ffffff; --primary: #0f766e; --primary-hover: #115e59;
      --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05); --shadow-lg: 0 10px 15px -3px rgba(15, 118, 110, 0.1);
      --card-bg: #fff; --btn-ghost-bg: #fff; --btn-action-bg: #e2e8f0; --item-bg: #f8fafc;
    }
    [data-theme="dark"] {
      --bg: #000000; --surface: #0f0f0f; --primary: #14b8a6; --primary-hover: #0d9488;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border: #27272a;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.5); --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.8);
      --card-bg: #0a0a0a; --btn-ghost-bg: #18181b; --btn-action-bg: #27272a; --item-bg: #111111;
    }

    body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); transition: 0.3s; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { width: 100%; max-width: 550px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-lg); transition: 0.3s; box-sizing: border-box; }
    
    .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0 0 4px; color: var(--primary); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    p { color: var(--text-muted); margin: 0; font-size: 13px; font-weight: 500; }
    
    .theme-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: 0.2s; color: var(--text-main); outline: none; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-main); }
    
    input[type="text"], input[type="tel"], select, input[type="file"] { width: 100%; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--item-bg); color: var(--text-main); outline: none; box-sizing: border-box; transition: all 0.3s ease; font-family: 'Inter', sans-serif; font-weight: 500; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1); background: var(--surface); }
    
    input[type="file"] { padding: 10px; cursor: pointer; }
    input[type="file"]::-webkit-file-upload-button { background: var(--btn-action-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text-main); font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: 0.2s; margin-right: 10px; }

    /* Dynamic Items Container */
    .items-container { background: var(--item-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .item-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
    .item-row:last-child { margin-bottom: 0; }
    .item-row input[type="text"] { flex: 2; }
    .item-row input[type="tel"] { flex: 1; text-align: center; }
    .remove-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 10px; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; transition: 0.2s; }
    .remove-btn:hover { background: #ef4444; color: #fff; }
    
    .add-item-btn { background: none; border: 2px dashed var(--border); color: var(--text-muted); width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; margin-top: 10px; }
    .add-item-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(20, 184, 166, 0.05); }

    .btn-submit { width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 16px; border: none; cursor: pointer; background: var(--primary); color: #fff; transition: 0.3s; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(15, 118, 110, 0.4); }
    .btn-submit:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7; }

    /* Success Message Box */
    .success-box { display: none; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; padding: 20px; border-radius: 16px; text-align: center; margin-top: 20px; }
    .success-box h3 { color: #10b981; margin: 0 0 8px 0; font-size: 18px; }
    .success-box p { color: var(--text-main); font-size: 14px; margin: 0; }

    /* Error Text */
    .error-text { color: #ef4444; font-size: 12px; font-weight: 600; margin-top: 6px; display: none; }

    @media (max-width: 480px) {
      body { padding: 15px; }
      .card { padding: 20px; }
      .item-row { flex-direction: column; align-items: stretch; gap: 8px; border-bottom: 1px dashed var(--border); padding-bottom: 12px; }
      .item-row:last-child { border-bottom: none; padding-bottom: 0; }
      .remove-btn { width: 100%; height: 40px; border-radius: 8px; font-size: 14px; }
      .remove-btn::after { content: " Remove Item"; }
    }
  </style>
</head>
<body>

  <div class="card" id="orderCard">
    <div class="header-section">
      <div>
        <h1>💊 Secure Pharma</h1>
        <p>Quick & Secure Home Delivery</p>
      </div>
      <button class="theme-btn" id="themeToggleBtn">☀️</button>
    </div>

    <form id="orderForm">
      
      <div class="form-group">
        <label for="customerName">🧑‍💼 Patient / Customer Name *</label>
        <input type="text" id="customerName" placeholder="e.g. Rahul Patel" required>
      </div>

      <div class="form-group">
        <label for="mobileNumber">📱 Mobile Number (WhatsApp) *</label>
        <input type="tel" id="mobileNumber" placeholder="10 Digit Number" maxlength="10" pattern="[0-9]{10}" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <div class="error-text" id="mobileError">Please enter a valid 10-digit number.</div>
      </div>

      <label>📦 Order Items *</label>
      <div class="items-container" id="itemsWrapper">
        <div class="item-row">
          <input type="text" class="product-input" placeholder="Medicine Name (e.g. Paracetamol 500mg)" required>
          <input type="tel" class="qty-input" placeholder="Qty" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
      </div>
      <button type="button" class="add-item-btn" id="addItemBtn">➕ Add More Medicine</button>

      <div class="form-group" style="margin-top: 20px;">
        <label for="prescriptionFile">📎 Upload Prescription (Optional)</label>
        <input type="file" id="prescriptionFile" accept="image/png, image/jpeg, application/pdf">
        <div class="error-text" id="fileError" style="color:#f59e0b;">File size must be less than 5MB.</div>
      </div>

      <div class="form-group">
        <label for="priority">⚡ Delivery Priority</label>
        <select id="priority">
          <option value="Normal">🟢 Normal (Standard Time)</option>
          <option value="Urgent">🔴 Urgent (As soon as possible)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">🚀 Place Order Now</button>
    </form>

    <div class="success-box" id="successBox">
      <h3>🎉 Order Placed Successfully!</h3>
      <p>Your order ID is <strong id="displayOrderId" style="color:var(--text-main);"></strong>. Our team will contact you shortly.</p>
      <button class="add-item-btn" onclick="location.reload()" style="margin-top: 15px;">Place Another Order</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRju9C_1S14BJcPlRyOCnb03vjvqGx1ZdSPu3X8_PicTLSCpWHv4T2tn3OtP7hJ07E/exec";
    
    // Theme logic
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';
    themeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pharmaTheme', next);
      themeBtn.innerText = next === 'dark' ? '☀️' : '🌙';
    });

    // Dynamic Items Logic
    const itemsWrapper = document.getElementById('itemsWrapper');
    const addItemBtn = document.getElementById('addItemBtn');

    addItemBtn.addEventListener('click', () => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <input type="text" class="product-input" placeholder="Medicine Name" required>
          <input type="tel" class="qty-input" placeholder="Qty" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
          <button type="button" class="remove-btn" onclick="this.parentElement.remove()">🗑️</button>
        `;
        itemsWrapper.appendChild(row);
    });

    // File Size Validation
    const fileInput = document.getElementById('prescriptionFile');
    const fileError = document.getElementById('fileError');
    let validFile = true;

    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            const fileSizeMB = this.files[0].size / (1024 * 1024);
            if (fileSizeMB > 5) {
                fileError.style.display = 'block';
                this.value = ''; 
                validFile = false;
            } else {
                fileError.style.display = 'none';
                validFile = true;
            }
        }
    });

    function getBase64(file) {
       return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result.split(',')[1]); 
          reader.onerror = error => reject(error);
       });
    }

    // Form Submission
    const orderForm = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');
    const mobileNumber = document.getElementById('mobileNumber');
    const mobileError = document.getElementById('mobileError');

    orderForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Mobile Validation
        if(mobileNumber.value.length !== 10) {
            mobileError.style.display = 'block';
            mobileNumber.focus();
            return;
        } else {
            mobileError.style.display = 'none';
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ Processing securely...';

        try {
            const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
            
            const products = document.querySelectorAll('.product-input');
            const qtys = document.querySelectorAll('.qty-input');
            const customerNameVal = document.getElementById('customerName').value.trim();
            const mobileNumVal = mobileNumber.value.trim();
            const priorityVal = document.getElementById('priority').value;
            
            let itemsArray = [];

            for(let i=0; i<products.length; i++) {
                if(products[i].value.trim() !== '' && qtys[i].value.trim() !== '') {
                    // MASTER PAYLOAD FIX: સબ-આઇટમ્સમાં બધી જ કી મોકલો
                    itemsArray.push({
                        orderId: orderId,
                        customer: customerNameVal,
                        name: customerNameVal,
                        customerName: customerNameVal,
                        mobile: mobileNumVal,
                        phone: mobileNumVal,
                        mobileNumber: mobileNumVal,
                        product: products[i].value.trim(),
                        qty: qtys[i].value.trim(),
                        priority: priorityVal
                    });
                }
            }

            // MASTER PAYLOAD FIX: મેઈન પેલોડમાં બધી જ કી મોકલો
            let payload = {
                action: 'newOrder',
                orderId: orderId,
                
                customer: customerNameVal,
                name: customerNameVal,
                customerName: customerNameVal,
                
                mobile: mobileNumVal,
                phone: mobileNumVal,
                contact: mobileNumVal,
                mobileNumber: mobileNumVal,
                
                product: products[0].value.trim(), // ફ્લેટ સ્ટ્રક્ચર માટે
                qty: qtys[0].value.trim(),         // ફ્લેટ સ્ટ્રક્ચર માટે
                priority: priorityVal,
                
                items: itemsArray,
                
                fileBase64: "",
                fileName: "",
                mimeType: ""
            };

            if (fileInput.files.length > 0 && validFile) {
                const file = fileInput.files[0];
                payload.fileBase64 = await getBase64(file);
                payload.fileName = orderId + '_' + file.name;
                payload.mimeType = file.type;
            }

            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if(data.status === 'success') {
                orderForm.style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
                document.getElementById('displayOrderId').innerText = orderId;
            } else {
                alert("Something went wrong! Please try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '🚀 Place Order Now';
            }

        } catch (error) {
            alert("Network Error: Please check your internet connection.");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '🚀 Place Order Now';
        }
    });

  </script>
</body>
</html>
